*\n\n### f)\nWhat was the broadcast address of the original block `41.1.16.0` - `41.1.31.255`?  \n**[1]**\n\n**[10]**\n\n---", "topic": "IP Addressing & Subnetting", "topicColour": "#7c3aed", "topicBg": "#ede9fe", "sourceLabel": "2025 Exam Q3", "isCurrent": false, "studyStatus": "Study"}, {"id": 55, "year": "2025", "paper": "Exam", "number": 4, "marks": "", "text": "Consider the following trace obtained from Wireshark. The first host is the sender, while the second in each line is the recipient. Hence, as an example, line 1 represents a segment transmitted from the Client to the Server.\n\n```text\n1)  Client  Server  [SYN]       Seq=0   Ack=0   Win=64240   Len=0\n2)  Server  Client  [SYN, ACK]  Seq=0   Ack=1   Win=64240   Len=0\n3)  Client  Server  [ACK]       Seq=1   Ack=1   Win=263168  Len=0\n4)  Client  Server  [ACK]       Seq=1   Ack=1   Win=263168  Len=365\n5)  Server  Client  [ACK]       Seq=1   Ack=366 Win=64128   Len=0\n6)  Server  Client  [ACK]       Seq=1   Ack=366 Win=64128   Len=568\n7)  Server  Client  [FIN, ACK]  Seq=569 Ack=366 Win=64128   Len=0\n8)  Client  Server  [ACK]       Seq=366 Ack=570 Win=262400  Len=0\n9)  Client  Server  [FIN, ACK]  Seq=366 Ack=570 Win=262400  Len=0\n10) Client  Server  [FIN, ACK]  Seq=366 Ack=570 Win=262400  Len=0\n11) Server  Client  [ACK]       Seq=570 Ack=367 Win=64128   Len=0\n```\n\nWireshark was configured to show layer 4 packets by default. All the packets shown are TCP packets. Only two IP addresses were associated with the captured packets; those addresses have been replaced by the words Client and Server in the trace above. The port number associated with the client was a high-order port, while the port associated with the server was 80. For the sake of readability, the port numbers are not shown in the trace. Following the Wireshark convention, TCP flags that are set in a segment are shown in uppercase in square brackets; flags that are not shown are reset in the segment. Other relevant header and calculated fields complete the trace summary. For ease of reference, lines have been numbered in a style that differs from the style used by Wireshark.\n\nAnswer the questions that follow based on the trace provided.\n\n### a)\nWhich line completes the opening handshake? Simply provide a number from 1 to 3.  \n**[1]**\n\n### b)\nLine 2 implies that line 1 contained a data byte. State the observation from line 2 from which this can be derived.  \n**[1]**\n\n### c)\nIn contrast to the previous question, line 1 stipulates that `Len=0`; therefore line 1 does not seem to carry a data byte at all. What type of byte is \"included\" in the packet from line 1?  \n**[1]**\n\n### d)\nDoes line 3 \"include\" a similar byte to that mentioned in the previous question? Why not?  \n**[1]**\n\n### e)\nThe packet from line 4 carries 365 data bytes to the server. How many bytes has the server apparently consumed at the time it first acknowledges the packet from line 4?  \n**[1]**\n\n### f)\nThe server then, in line 6, sends a response consisting of 568 bytes to the client. In which line does the client first acknowledge this data from the server?  \n**[1]**\n\n### g)\nNote that the server transmits a packet with `Seq=569` in line 7; in fact `Seq=569` is what one would expect at this time. However, in line 11 it transmits a packet with `Seq=570`. Which packet caused the sequence number to be increased? Simply provide a number from 1 to 11.  \n**[1]**\n\n### h)\nHow many of the 568 bytes that the server transmitted in line 6 have been consumed by the client at the time the client transmits its final message in this trace, line 10? Very briefly explain.  \n**[1]**\n\n### i)\nThe packet in line 7 obviously plays a role in the termination handshake, but seems unexpected at this time given the theory discussed in the module. Is it part 1, 2, or 3 of the handshake? Very briefly justify your answer.  \n**[1]**\n\n### j)\nWhy was it necessary to transmit the packet in line 10?  \n**[1]**\n\n**[10]**\n\n---", "topic": "IP Addressing & Subnetting", "topicColour": "#7c3aed", "topicBg": "#ede9fe", "sourceLabel": "2025 Exam Q4", "isCurrent": false, "studyStatus": "Study"}, {"id": 56, "year": "2025", "paper": "Exam", "number": 5, "marks": "", "text": "Assume the following:\n\n- `za1.dnsnode.net` is able to resolve names in the `za.` zone.\n- `coza1.dnsnode.net` is able to resolve names in the `co.za` zone.\n- `ns1.host-h-net` is able to resolve names in the `xx.co.za` zone; it is the primary name server for `xx.co.za`.\n- `ns2.host-h-net` is able to resolve names in the `xx.co.za` zone; it is the secondary name server for `xx.co.za`.\n- The IPv4 address of `xx.co.za` is `41.203.18.59`.\n- The IPv4 address of `ftp.xx.co.za` is `197.221.2.30`.\n- The IPv6 address of `xx.co.za` is `2606:4700:20::ec5`.\n- The servers accepting email at `xx.co.za` are `ASPMX.L.GOOGLE.COM` and `ALT1.ASPMX.L.GOOGLE.COM`, where the latter should be used when the former is not available.\n\nAssume that all the name servers used in this question are primary name servers.\n\nIn some questions below the zone is specified, typically `xx.co.za`. In other cases you have to infer the zone from the context; the root name servers, for example, provide information about the root zone. Recall that a zone file defines entries relative to the zone for which the zone file exists. The zone file for `com.` will have an entry that points to, say, the `ibm.com` domains; that entry will simply define `ibm` in that zone file, since the `com.` all definitions in that zone file will be followed by a `.com`.\n\nUse names as the definitions of your resource records; you, for example, do not know what the IPv4 address of, say, `za1.dnsnode.net` is.\n\nUse this information to provide the following zone records. Your zone records will, in general, consist of three columns: the entry being defined, the resource record type and the definition, with additional information only in cases where the resource record requires additional information.\n\n### a)\nProvide the resource record for the zone file at `a.root-servers.net` that may be useful to recursively resolve `ftp.xx.co.za`.  \n**[1]**\n\n### b)\nProvide the resource record for the zone file at `za1.dnsnode.net` that may be useful to recursively resolve `ftp.xx.co.za`.  \n**[1]**\n\n### c)\nProvide the resource record for the zone file at `coza1.dnsnode.net` that may be useful to recursively resolve `ftp.xx.co.za`.  \n**[1]**\n\n### d)\nProvide the resource record for the zone file at `ns1.host-h-net` to indicate that it is the primary name server for `xx.co.za`.  \n**[1]**\n\n### e)\nProvide the resource record for the zone file of `xx.co.za` that may be useful to recursively resolve `ftp.xx.co.za`.  \n**[1]**\n\n### f)\nProvide the resource record for the zone file of `xx.co.za` that may be useful to recursively resolve `xx.co.za` to an IPv4 address.  \n**[1]**\n\n### g)\nProvide the resource record for the zone file of `xx.co.za` that may be useful to recursively resolve `ftp.xx.co.za` to an IPv6 address.  \n**[1]**\n\n### h)\nProvide the resource record for the zone file of `xx.co.za` that may be useful to recursively resolve the details of the primary email server for `xx.co.za`.  \n**[1]**\n\n### i)\nProvide the resource record for the zone file of `xx.co.za` that may be useful to recursively resolve the details of the secondary mail server for `xx.co.za`.  \n**[1]**\n\n### j)\nProvide a resource record for the zone file of `xx.co.za` that will add an entry of the form `x=1` to the zone.  \n**[1]**\n\n**[10]**\n\n---\n\n> Note: The supplied PDF contains scanned pages up to the displayed continuation marker after Question 5. No additional page was available in the uploaded file.", "topic": "DNS", "topicColour": "#0e7490", "topicBg": "#cffafe", "sourceLabel": "2025 Exam Q5", "isCurrent": false, "studyStatus": "Study"}, {"id": 57, "year": "2026", "paper": "ST1", "number": 2, "marks": "", "text": "a) Which gTLD is used by American universities?\n\nb) What is the process of converting a fully qualified domain name to an address called?\n\nc) To create the domain `xx.co.za` the registrar of `co.za` has to insert NS entries in the `co.za` zone file; these NS entries will point to the name servers of the new domain. What is the process of inserting such entries called? *(Hint: Phrased somewhat differently, the registrar has to ... authority; the missing word should assist you to find the answer.)*\n\nd) Who is in control of the `za.` ccTLD? Provide the acronym used by this entity; the question does not refer to the `co.za` registry operator, nor to entities that exert control over all TLDs.\n\ne) Which committee has the authority to approve new top-level domains? Provide the acronym that identifies this committee.\n\n---", "topic": "DNS", "topicColour": "#0e7490", "topicBg": "#cffafe", "sourceLabel": "2026 ST1 Q2", "isCurrent": true, "studyStatus": "Skip for exam review"}, {"id": 58, "year": "2026", "paper": "ST1", "number": 3, "marks": "", "text": "In some network nodes P and Q are neighbours. Communication between them costs 6 units. Below, the partial routing tables at P and Q are provided at some initial time $t_0$. Each entry in a routing table is a triple consisting of a destination, the next hop en route to that destination and the total cost of sending data to the destination via the current route. The network uses the Bellman-Ford algorithm.\n\nAt some time $t_1$, Q shares its routing table with P, and P makes all the updates it can, based on the received information. At some later time $t_2$, P shares its updated routing table with Q and Q makes all the updates it can, based on the received update.\n\nThe questions below consist of a node (P or Q), a time ($t_1$ or $t_2$) and a destination. You are expected to consult the routing table of the node as updated by the shared information at the time noted, and provide the next-hop and cost for the destination mentioned. As an example, the initial entry in P's table for destination Q is `(P, Q, 6)`. The information received by P at time $t_1$ does not affect this entry and it therefore remains `(P, Q, 6)` after $t_1$. Therefore, the expected answer for the question \"P after $t_1$\" would be \"Q, 6\".\n\n### Initial routing table at P\n\n| Destination | Next hop | Cost |\n|---|---:|---:|\n| A | M | 15 |\n| B | M | 22 |\n| F | L | 14 |\n| H | Q | 18 |\n| K | K | 6 |\n| L | K | 7 |\n| R | Q | 12 |\n| U | Q | 11 |\n\n### Initial routing table at Q\n\n| Destination | Next hop | Cost |\n|---|---:|---:|\n| A | P | 21 |\n| C | D | 15 |\n| H | P | 12 |\n| K | P | 14 |\n| R | R | 6 |\n| U | U | 5 |\n| Z | Z | 7 |\n\nAnswer the following:\n\na) $t_1$, C =  \nb) $t_1$, H =  \nc) $t_2$, K =  \nd) $t_2$, H =  \ne) $t_2$, Z =  \n\n---", "topic": "Routing Algorithms", "topicColour": "#1d4ed8", "topicBg": "#dbeafe", "sourceLabel": "2026 ST1 Q3", "isCurrent": true, "studyStatus": "Skip for exam review"}, {"id": 59, "year": "2026", "paper": "ST1", "number": 4, "marks": "", "text": "### a) Convert the following Unicode characters to UTF-8.\n\n(i) `U+00E4`  \n(ii) `U+039E`  \n(iii) `U+179F`  \n(iv) `U+1F9A7`\n\n### b) Consider the following sequence of bytes. It is UTF-8 encoded, but contains some errors. Decode the characters that are properly encoded, and list them one per line in the sequence in which they occur in the byte sequence, and write them on the answer sheet separated by commas, for example `U+1234`, `U+5678`. Ignore any bytes in the byte string that do not form part of a complete UTF-8 character.\n\n```text\nEF BB AF BC C2 AA F1 83\nE0 AA AA F0 90 AB C3 D5\n```\n\n---", "topic": "Encoding & Presentation", "topicColour": "#dc2626", "topicBg": "#fee2e2", "sourceLabel": "2026 ST1 Q4", "isCurrent": true, "studyStatus": "Skip for exam review"}, {"id": 60, "year": "2026", "paper": "ST1", "number": 5, "marks": "", "text": "The code provided below forms part of a possible submission for practical assignment 3 in a Java-like language. Recall that this assignment required you to implement a web server that emulated a clock; when one clicked on the name of a city, the local time in that city would be displayed. It should be simple enough to follow even for those not quite familiar with Java.\n\nTo help those not quite familiar with Java, consider line 06 as an example. The variable `rL` is declared and read. It reads a line from the socket just opened; hence it would read the first line of the HTTP request.\n\nNext, consider line 08. It defines `rT` as a character `String` array with as many elements as required (indexed from 0). The content of `rL` is split into several strings; the split is made wherever a space occurs in this character string. Every substring is then stored into a subsequent element of `rT`. Hence, if the line `ab cd ef` was read, then `rT[0]` would be `ab`, `rT[1]` would be `cd` and `rT[2]` would be `ef`.\n\nStudy the code fragment and then answer the following questions. Answer the questions in terms of the protocol and not by just explaining what the code does. If you are, for example, asked about line 06 it would not be worth any marks to say that a line is read from the socket and stored in `rL`. As you know, an HTTP request consists of several lines; from studying the code, it should be clear that line 06 reads the first line of the HTTP request. Mentioning the HTTP request turns the answer into one that says something about the protocol. Please omit the initial words of your answer, such as \"Its purpose is to\"; start writing your answer with the word that would follow such an introduction.\n\na) Very briefly explain the purpose of line 17.  \nb) Very briefly explain the purpose of line 18.  \nc) Very briefly explain the purpose of line 19.  \nd) Very briefly explain the purpose of line 24.  \ne) What should the missing code in line 13 do?\n\n```java\n01  while (true) {\n02      Socket clientSocket = serverSocket.accept();\n03      BufferedReader in = new BufferedReader(new\n            InputStreamReader(clientSocket.getInputStream()));\n04      OutputStream out = clientSocket.getOutputStream();\n\n06      String rL = in.readLine();\n\n07      if (rL != null) {\n08          String[] rT = rL.split(\" \");\n09          String rM = rT[0];\n10          String rU = rT[1];\n\n12          if (rM == \"HEAD\") {\n13              ...\n14          }\n\n16          else if (rM == \"GET\") {\n17              out.write(\"HTTP/1.1 200 OK\\r\\n\");\n18              out.write(\"Content-Type: text/html\\r\\n\");\n19              out.write(\"\\r\\n\");\n20              if (rU.startsWith(\"/?City=\")) {\n21                  ...\n22                  String ExtractedcityName = rU.substring(7);\n23                  ...\n24                  out.write(\"<!DOCTYPE html>\");\n25                  out.write(\"<html><head>\");\n26                  out.write(\"<meta http-equiv=\\\"REFRESH\\\" content=\\\"4\\\">\");\n27                  out.write(\"<title> World Clock <\/title>\");\n28                  ...\n29              }\n30              else {\n31                  ...\n32              }\n33          }\n34          out.close();\n35          in.close();\n36          clientSocket.close();\n37      }\n38  }\n```", "topic": "Application Protocols", "topicColour": "#16a34a", "topicBg": "#dcfce7", "sourceLabel": "2026 ST1 Q5", "isCurrent": true, "studyStatus": "Skip for exam review"}, {"id": 61, "year": "2026", "paper": "ST2", "number": 2, "marks": "", "text": "Two nodes, A and B, are communicating using TCP. At time `t0` node A is ready to send byte 100, expects byte 300, has a window size of 500 and thinks that B has a window size of 300. These values perfectly match what node B knows about the connection. Nodes A and B subsequently exchange a couple of messages, `m1` to `m5`. The following table provides the length, direction, transmission and arrival time of each message. Some messages are received almost instantaneously, while other messages are received only after some delay. However, no acknowledgement time-outs ever occur.\n\n| Message | Direction | Length | Transmission time | Arrival time |\n|---|---|---:|---|---|\n| `m1` | A → B | 10 | `t1` | `t1` |\n| `m2` | B → A | 20 | `t2` | `t2` |\n| `m3` | A → B | 30 | `t3` | `t4` |\n| `m4` | B → A | 40 | `t3` | `t4` |\n| `m5` | A → B | 50 | `t5` | `t5` |\n\nProvide the values of the following header fields of the various messages.\n\n1. Acknowledgement number of `m1`.\n2. Sequence number of `m2`.\n3. Acknowledgement number of `m3`.\n4. Acknowledgement number of `m4`.\n5. Window advertisement of `m5`.\n\n---", "topic": "Transport Layer (TCP/UDP/QUIC)", "topicColour": "#d97706", "topicBg": "#fef3c7", "sourceLabel": "2026 ST2 Q2", "isCurrent": true, "studyStatus": "Skip for exam review"}, {"id": 62, "year": "2026", "paper": "ST2", "number": 3, "marks": "", "text": "You are strongly encouraged to write your answers in your script and copy them afterwards to your answer sheet - in particular for this question.\n\nThe computer H is a host on Acme Corporation's network. Its IP address is `222.222.222.222`. At this stage Acme Corporation does not use any subnetting. Provide all IP addresses in CIDR notation. Note that CIDR notation is never used for a netmask.\n\n1. Provide Acme Corporation's network address.\n2. Provide the broadcast address for Acme Corporation.\n3. Provide the netmask used by Acme Corporation.\n\nAcme Corporation wants to subnet its network into at least 10 subnets, such that each subnet can handle at least 50 hosts. Assume the IP address of host H is not changed.\n\n4. Provide the netmask that Acme Corporation now uses on its internal network.\n5. Provide the network address of the subnet on which H now resides.\n6. Provide the broadcast address of the subnet on which H now resides.\n7. According to Acme Corporation's plan ten subnets, numbered from 0 to 9, had to be created. What is the number of the subnet on which H is now located? A logical answer would be a number from 0 to 9. However, the subnetting process could have created more than these ten subnets.\n8. According to Acme Corporation's plans, each subnet would support at least 50 hosts, numbered from 1 to 50. However, the subnetting process could have created support for host numbers beyond 50. What is the host number of H on its new subnet?\n\nAcme Corporation now finds that it needs one subnet that can handle more hosts than what they initially anticipated. They therefore decide to supernet exactly four subnets. One of the four subnets to be used is the subnet on which H resides. The IP address of H has to remain unchanged.\n\n9. Provide the network address of the new supernet that is now created.\n10. Provide the netmask to be used on this new supernet.\n\n---", "topic": "IP Addressing & Subnetting", "topicColour": "#7c3aed", "topicBg": "#ede9fe", "sourceLabel": "2026 ST2 Q3", "isCurrent": true, "studyStatus": "Skip for exam review"}, {"id": 63, "year": "2026", "paper": "ST2", "number": 4, "marks": "", "text": "Some TCP timers are created when necessary. Other TCP timers exist for the duration of a connection. When the former timers are created, they start counting down. When the pre-existing timers are activated, they start counting down. For both these counter types we will simply say that they are activated. A counting timer may be stopped; for the former type of counters, stopping would mean that they are deleted; for the latter type, the counter may simply remain in this stopped state. When a timer reaches 0, it is said to expire; again this may cause the timer to be deleted or to just remain with a 0 value until they are activated again. A counter may be reset, which would mean it starts counting down from its initial value again. For the questions that follow, only provide the name of the timer. If the answer is the persistent timer, simply say persistent. Note that the timer would always be local to the endpoint at which the event, such as receiving a segment, occurs.\n\n1. Name a timer that is activated when an endpoint transmits a segment containing data.\n2. Name a timer that is activated when an endpoint receives a segment containing data.\n3. Name a timer that is reset whenever an endpoint receives any segment.\n4. Name a timer that would cause a probe to be transmitted if it expires.\n5. Name a timer that may be stopped when an endpoint receives a segment that contains an acknowledgement number.\n\n---", "topic": "Transport Layer (TCP/UDP/QUIC)", "topicColour": "#d97706", "topicBg": "#fef3c7", "sourceLabel": "2026 ST2 Q4", "isCurrent": true, "studyStatus": "Skip for exam review"}, {"id": 64, "year": "2026", "paper": "ST2", "number": 5, "marks": "", "text": "Consider the two routing tables provided below.\n\nLet's call the first router R1. R1 has a number of interfaces with names ranging from `eth0` to `eth11`. It also has a loopback interface, `lo`. It runs the EdgeOS operating system, which you have presumably not seen before. However, you should be able to interpret its output based on your knowledge of what one would expect in a routing table.\n\n```text\n$ show ip route\nCodes: K - kernel, C - connected, S - static, R - RIP, B - BGP\n       O - OSPF, IA - OSPF inter area,\n       N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2\n       E1 - OSPF external type 1, E2 - OSPF external type 2\n       > - selected route, * - FIB route, p - stale info\n\nIP Route Table for VRF \"default\"\nS    *> 0.0.0.0/0 [1/0] via 192.168.2.14, eth9\nC    *> 10.1.0.0/16 is directly connected, eth0\nC    *> 127.0.0.0/8 is directly connected, lo\nC    *> 192.168.2.0/24 is directly connected, eth9\n```\n\nLet's call the second router R2. The address associated with one of the network interfaces of R2 is `192.168.2.14`. Besides being a router, R2 is also a NAT box that serves as a default route: it would replace the source address of any packet that it cannot deliver with its public address and then forward the IP datagram using the PPPoE protocol to another router from which it will travel to its ultimate destination. R2 uses a version of Linux with which you are presumably not familiar. Some columns of its routing table are not shown to simplify matters. Note the use of Genmask in Linux, which is similar to a netmask. Note the use of Gateway to indicate the next hop, which is `0.0.0.0` for a direct delivery.\n\n```text\n# netstat -r\nKernel IP routing table\nDestination     Gateway        Genmask          Flags  Metric  Iface\n10.1.0.0        192.168.2.13   255.255.0.0      UG     1       br0\n41.170.74.97    0.0.0.0        255.255.255.255  UH     0       ppp0\n192.168.1.0     192.168.2.13   255.255.255.0    UG     1       br0\n192.168.2.0     0.0.0.0        255.255.255.0    U      0       br0\n```\n\nHere is the initial output of a `tracert` command executed from a host on the network. Let's call this host H.\n\n```text\nC:\\>tracert -d 8.8.8.8\n\nTracing route to 8.8.8.8 over a maximum of 30 hops\n\n  1    <1 ms    <1 ms    <1 ms    10.1.1.13\n  2    <1 ms    <1 ms    <1 ms    192.168.2.14\n  3     2 ms     2 ms     1 ms    41.170.74.97\n  ...\n```\n\nSome questions below will ask you about a route, or path, that will be traced by `tracert` or `traceroute`. For the case above this route, or path, would refer to `10.1.1.13`, `192.168.2.14`, `41.170.74.97`, ... The `-d` flag used with the command simply means \"Do no resolve\" - in other words, it should provide the IP addresses, rather than attempt to find a name in the DNS that matches an address.\n\nAssume C1 is a computer connected as `192.168.1.1` and C2 is connected as `192.168.2.1`. Now answer the following questions about the network.\n\n1. To which interface on which router is H connected?\n2. R1 and R2 are obviously directly connected. Name the interface of R1 and the interface of R2 that are connected.\n3. Assume the command `traceroute -d 192.168.2.1` is executed on C1. Provide the path that will be returned.\n4. Assume the command `traceroute -d 192.168.1.1` is executed on C2. C2 is just a plain workstation without any additional network functionality. The route shown will still either be `192.168.2.13` followed by `192.168.1.1`, or it will be `192.168.2.14`, `192.168.2.13` and `192.168.1.1`. Which one of C2's configuration parameters will determine which of the two outcomes will be observed?\n5. Suppose the command `traceroute -d 10.10.10.10` is executed on C1. Provide the second node on the path that would be returned by this command.", "topic": "DNS", "topicColour": "#0e7490", "topicBg": "#cffafe", "sourceLabel": "2026 ST2 Q5", "isCurrent": true, "studyStatus": "Skip for exam review"}];

    const TOPIC_COLOURS = {"DNS": ["#0e7490", "#cffafe"], "Routing Algorithms": ["#1d4ed8", "#dbeafe"], "IP Addressing & Subnetting": ["#7c3aed", "#ede9fe"], "Network Layer (IP/ICMP/ARP)": ["#be185d", "#fce7f3"], "Transport Layer (TCP/UDP/QUIC)": ["#d97706", "#fef3c7"], "Application Protocols": ["#16a34a", "#dcfce7"], "Encoding & Presentation": ["#dc2626", "#fee2e2"], "Data Link Layer": ["#0f766e", "#ccfbf1"], "General": ["#374151", "#f3f4f6"]};

    const state = {
      search: "",
      topic: "all",
      seen: "all",
      source: "all",
      sort: "source",
      years: new Set(["2022", "2023", "2024", "2025", "2026"]),
      papers: new Set(["ST1", "ST2", "Exam"]),
      expandedIds: new Set(),
      allExpanded: false,
    };

    const els = {
      search: document.getElementById("search"),
      topicFilter: document.getElementById("topicFilter"),
      seenFilter: document.getElementById("seenFilter"),
      sourceFilter: document.getElementById("sourceFilter"),
      sortBy: document.getElementById("sortBy"),
      yearChecks: document.getElementById("yearChecks"),
      paperChecks: document.getElementById("paperChecks"),
      results: document.getElementById("results"),
      resultText: document.getElementById("resultText"),
      sourceText: document.getElementById("sourceText"),
      statVisible: document.getElementById("stat-visible"),
      resetBtn: document.getElementById("resetBtn"),
      expandAllBtn: document.getElementById("expandAllBtn"),
    };

    const paperRank = { ST1: 0, ST2: 1, Exam: 2 };

    function selectedValues(container) {
      return new Set([...container.querySelectorAll("input:checked")].map(i => i.value));
    }

    function textOf(row) {
      return [row.text, row.topic, row.sourceLabel, row.studyStatus].join(" ").toLowerCase();
    }

    function sourceSort(a, b) {
      const ya = Number(a.year), yb = Number(b.year);
      if (ya !== yb) return ya - yb;
      const pa = paperRank[a.paper] ?? 9, pb = paperRank[b.paper] ?? 9;
      if (pa !== pb) return pa - pb;
      return a.number - b.number;
    }

    function applyFilters() {
      state.search = els.search.value.trim().toLowerCase();
      state.topic = els.topicFilter.value;
      state.seen = els.seenFilter.value;
      state.source = els.sourceFilter.value;
      state.sort = els.sortBy.value;
      state.years = selectedValues(els.yearChecks);
      state.papers = selectedValues(els.paperChecks);

      let rows = DATA.filter(row => {
        if (state.search && !textOf(row).includes(state.search)) return false;
        if (state.topic !== "all" && row.topic !== state.topic) return false;
        if (state.seen === "seen" && !row.isCurrent) return false;
        if (state.seen === "unseen" && row.isCurrent) return false;
        if (state.source !== "all" && row.sourceLabel.split(" Q")[0] !== state.source) return false;
        if (!state.years.has(row.year)) return false;
        if (!state.papers.has(row.paper)) return false;
        return true;
      });

      rows.sort((a, b) => {
        if (state.sort === "topic") return a.topic.localeCompare(b.topic) || sourceSort(a, b);
        if (state.sort === "status") return Number(a.isCurrent) - Number(b.isCurrent) || sourceSort(a, b);
        if (state.sort === "id") return a.id - b.id;
        return sourceSort(a, b);
      });

      render(rows);
      return rows;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Minimal markdown-to-HTML renderer
    function mdToHtml(md) {
      // Protect code blocks
      const blocks = [];
      md = md.replace(/```([\s\S]*?)```/g, (_, code) => {
        const i = blocks.length;
        blocks.push(`<pre><code>${escHtml(code.trim())}</code></pre>`);
        return `\x00BLOCK${i}\x00`;
      });

      const lines = md.split("\n");
      const out = [];
      let inTable = false;
      let inList = false;
      let inOl = false;

      function closeList() {
        if (inList) { out.push("</ul>"); inList = false; }
        if (inOl) { out.push("</ol>"); inOl = false; }
      }
      function closeTable() {
        if (inTable) { out.push("</tbody></table>"); inTable = false; }
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Restore code blocks
        if (line.includes("\x00BLOCK")) {
          closeList(); closeTable();
          out.push(line.replace(/\x00BLOCK(\d+)\x00/g, (_, n) => blocks[Number(n)]));
          continue;
        }

        // HR
        if (/^---+$/.test(line.trim())) {
          closeList(); closeTable();
          out.push("<hr>");
          continue;
        }

        // Headings
        const hm = line.match(/^(#(1, 4))\s+(.*)/);
        if (hm) {
          closeList(); closeTable();
          const level = Math.min(hm[1].length + 2, 6); // shift h1→h3, h2→h4, etc.
          out.push(`<h${level}>${inline(hm[2])}</h${level}>`);
          continue;
        }

        // Blockquote
        if (/^>/.test(line)) {
          closeList(); closeTable();
          out.push(`<blockquote>${inline(line.replace(/^>\s*/, ""))}</blockquote>`);
          continue;
        }

        // Table rows
        if (/^\|/.test(line.trim())) {
          const cells = line.split("|").slice(1, -1).map(c => c.trim());
          if (!inTable) {
            closeList();
            out.push('<table><thead><tr>' + cells.map(c => `<th>${inline(c)}</th>`).join("") + '</tr></thead><tbody>');
            inTable = true;
            // skip separator line
            if (i + 1 < lines.length && /^\|[-:|\s|]+\|$/.test(lines[i+1].trim())) i++;
            continue;
          }
          out.push('<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join("") + '</tr>');
          continue;
        } else if (inTable) {
          closeTable();
        }

        // Unordered list
        const ulm = line.match(/^(\s*[-*]\s+)(.*)/);
        if (ulm) {
          if (inOl) { out.push("</ol>"); inOl = false; }
          if (!inList) { out.push("<ul>"); inList = true; }
          out.push(`<li>${inline(ulm[2])}</li>`);
          continue;
        }

        // Ordered list
        const olm = line.match(/^\s*(\d+)[.)\s]+(.+)/);
        if (olm) {
          if (inList) { out.push("</ul>"); inList = false; }
          if (!inOl) { out.push("<ol>"); inOl = true; }
          out.push(`<li>${inline(olm[2])}</li>`);
          continue;
        }

        closeList(); closeTable();

        // Blank line
        if (!line.trim()) {
          out.push("");
          continue;
        }

        out.push(`<p>${inline(line)}</p>`);
      }

      closeList(); closeTable();
      return out.join("\n");
    }

    function inline(s) {
      s = escHtml(s);
      // Bold
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      // Italic
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      // Inline code
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      return s;
    }

    function render(rows) {
      els.statVisible.textContent = rows.length;
      els.resultText.textContent = `${rows.length} visible, ${rows.filter(r => r.isCurrent).length} in 2026 tests`;
      els.sourceText.textContent = state.source === "all" ? "All sources" : state.source;

      if (!rows.length) {
        els.results.innerHTML = '<div class="empty">No questions match the current filters.</div>';
        return;
      }

      els.results.innerHTML = rows.map(row => {
        const isOpen = state.allExpanded || state.expandedIds.has(row.id);
        const statusClass = row.isCurrent ? "seen" : "study";
        const statusText = row.isCurrent ? "Seen in 2026 tests" : "Study";
        const marksText = row.marks ? `${row.marks} marks` : "";
        const preview = row.text.replace(/[\r\n]+/g, " ").replace(/#+\s/g, "").trim().slice(0, 220);
        const [tc, tb] = TOPIC_COLOURS[row.topic] || ["#374151", "#f3f4f6"];

        return `
<article class="lq" data-id="${row.id}">
  <div class="lq-head${isOpen ? " open" : ""}" onclick="toggleCard(${row.id}, this)">
    <div class="lq-id">#${row.id}</div>
    <div class="lq-meta">
      <div class="lq-source">${escHtml(row.sourceLabel)}</div>
      <p class="lq-preview">${escHtml(preview)}…</p>
    </div>
    <div class="badges">
      <span class="badge" style="color:${tc};background:${tb}">${escHtml(row.topic)}</span>
      <span class="badge ${statusClass}">${escHtml(statusText)}</span>
      ${marksText ? `<span class="badge marks">${escHtml(marksText)}</span>` : ""}
    </div>
  </div>
  <div class="lq-body${isOpen ? " open" : ""}">${mdToHtml(row.text)}</div>
</article>`;
      }).join("");
    }

    function toggleCard(id, headEl) {
      const article = headEl.closest(".lq");
      const body = article.querySelector(".lq-body");
      const isOpen = body.classList.contains("open");
      if (isOpen) {
        body.classList.remove("open");
        headEl.classList.remove("open");
        state.expandedIds.delete(id);
      } else {
        body.classList.add("open");
        headEl.classList.add("open");
        state.expandedIds.add(id);
      }
    }

    function resetFilters() {
      els.search.value = "";
      els.topicFilter.value = "all";
      els.seenFilter.value = "all";
      els.sourceFilter.value = "all";
      els.sortBy.value = "source";
      [...document.querySelectorAll(".checks input")].forEach(i => i.checked = true);
      state.expandedIds.clear();
      state.allExpanded = false;
      els.expandAllBtn.textContent = "Expand all";
      applyFilters();
    }

    function toggleExpandAll() {
      state.allExpanded = !state.allExpanded;
      els.expandAllBtn.textContent = state.allExpanded ? "Collapse all" : "Expand all";
      // Re-render to apply expansion state
      applyFilters();
    }

    [els.search, els.topicFilter, els.seenFilter, els.sourceFilter, els.sortBy]
      .forEach(el => el.addEventListener("input", applyFilters));
    [els.yearChecks, els.paperChecks].forEach(el => el.addEventListener("change", applyFilters));
    els.resetBtn.addEventListener("click", resetFilters);
    els.expandAllBtn.addEventListener("click", toggleExpandAll);

    applyFilters();
  </script>
</body>
</html>
