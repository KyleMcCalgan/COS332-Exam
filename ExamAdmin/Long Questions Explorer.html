lly sets TTL to small values (starting at 1) to cause routers to discard packets and return ICMP Time Exceeded messages, revealing each hop's address.\n\n**2. ICMP message used by traceroute:**\n\n**ICMP Time Exceeded** (Type 11, Code 0: \"Time to Live exceeded in transit\") — routers return this message when they decrement TTL to zero.\n\n**3. ICMP request used by ping:**\n\n**ICMP Echo Request** (Type 8) — ping sends Echo Requests and waits for ICMP Echo Reply (Type 0).\n\n**4. IPv4 link-local addresses (CIDR):**\n\n**169.254.0.0/16** (range 169.254.0.0 – 169.254.255.255; used by APIPA when DHCP is unavailable)\n\n**5. Default gateway destination in routing table (CIDR):**\n\n**0.0.0.0/0** (the default route — matches all destinations; packets not matched by more specific routes are forwarded to the default gateway)","45":"**[a]** **registrar** (xneelo acts as the domain registrar when adding the domain to the co.za registry)\n\n**[b]** **ZACR** (the .co.za registry is operated by the ZA Central Registry, ZACR / DNS.co.za)\n\n**[c]** **registrant** (the domain owner/registrant details are returned first)\n\n**[d]** **administrative** (the administrative contact)\n\n**[e]** **technical** (the technical contact)\n\n**[f]** **redacted** (WHOIS privacy protection/GDPR compliance causes personal information to be redacted/hidden)\n\n**[g]** **43** (the WHOIS service traditionally uses port 43)\n\n**[h]** **who.is** (a domain-name-hacked URL: `who.is` provides WHOIS lookup service; or `rdap.org`)\n\n**[i]** **ZACR / .za Domain Name Authority (ZADNA)** — ZADNA sets policy for all .za domains that South African registrars must follow.\n\n**[j]** **ccTLD** (country code Top-Level Domain — `za.` is South Africa's ccTLD)","46":"Zone file for `xx.co.za` (SOA omitted, names are relative to `xx.co.za`):\n\n```dns\n@           A       41.203.18.59\nwww         CNAME   @\n@           MX      10 ASPMX.L.GOOGLE.COM.\n@           MX      20 ALT1.ASPMX.L.GOOGLE.COM.\n@           NS      ns1.host-h.net.\n@           NS      ns2.host-h.net.\nabc         NS      ns1.host-h.net.\nabc         NS      ns2.host-h.net.\n@           AAAA    2001::1234\n@           TXT     \"Raspberry Pi\"\n```\n\n**Explanation:**\n- `@ A 41.203.18.59` — A record for the apex domain\n- `www CNAME @` — www is a CNAME to apex (avoids duplicate A record; if IP changes, only A needs updating)\n- MX 10 for primary, MX 20 for secondary (higher number = lower preference)\n- NS records point to the name servers\n- `abc NS ns1/ns2` — delegates subdomain to same name servers\n- `@ AAAA 2001::1234` — IPv6 address\n- `@ TXT \"Raspberry Pi\"` — TXT record for machine description","47":"**Edges:** A-B:1, A-F:10, B-C:6, B-E:1, C-D:1, D-E:3, E-F:2\n\n**Dijkstra from A:**\n\n**Iteration 1:** S={A}. Neighbours: B=1, F=10. Cheapest: **B=1**. Add B.\n\n**Iteration 2:** S={A,B}. From B: C=1+6=7, E=1+1=2, F=min(10,1+?)... B-F not listed, F stays 10.\nCosts: C=7, E=2, F=10. Cheapest: **E=2**. Add E.\n\n**Iteration 3:** S={A,B,E}. From E: F=min(10,2+2)=4, D=2+3=5.\nCosts: C=7, F=4, D=5. Cheapest: **F=4**. Add F.\n\n**Iteration 4:** S={A,B,E,F}. F-? no new edges listed (A-F already done, E-F done).\nCosts: C=7, D=5. Cheapest: **D=5**. Add D.\n\n**Iteration 5:** S={A,B,E,F,D}. From D: C=min(7,5+1)=6.\nCosts: C=6. Add C.\n\n**Answers:**\n\n**a) Node picked as cheapest at end of iteration 3:** **F** (cost 4)\n\n**b) Cost to reach C after completing iteration 3:** **7** (via A→B→C, cost 1+6=7; not yet improved)\n\n**c) Node that will finally deliver to C after iteration 3:** **B** (predecessor of C is B at this point, path A→B→C)\n\n**d) Node added at end of iteration 4:** **D** (cost 5)\n\n**e) Cost to reach C after completing iteration 4:** **6** (updated via D: D→C cost = 5+1=6 < 7)","48":"**a) What does the \"d\" in BIND stand for?**\n\n**daemon** — BIND stands for Berkeley Internet Name **Daemon**\n\n**b) Protocol Apache is typically deployed for:**\n\n**HTTP** (Hypertext Transfer Protocol) — Apache is primarily a web server handling HTTP (and HTTPS) requests.\n\n**c) Service offered by Telnet:**\n\nTelnet provides a **remote virtual terminal** (Network Virtual Terminal) service, allowing a user to interactively log into and use a remote computer's command-line interface.\n\n**d) Correct terminology when DNS converts a domain name to IP:**\n\nThe server **resolves** the domain name. (DNS resolution — \"the server resolves the domain name to an IP address\")\n\n**e) First entry of each pair in /etc/hosts:**\n\nAn **IP address** — each line in `/etc/hosts` maps an IP address to one or more hostnames: `IP_address hostname [aliases...]`","49":"**All values in hexadecimal.**\n\n**a) U+1842 → UTF-8:**\n\n0x1842 = 0001 1000 0100 0010. Range U+0800–U+FFFF → 3-byte: `1110xxxx 10xxxxxx 10xxxxxx`\nSplit 4+6+6: `0001` `100001` `000010`\nEncoded: `1110 0001` `10 100001` `10 000010` = **`E1 A1 82`**\n\n**b) U+10AD0 → UTF-8:**\n\n0x10AD0 = 0001 0000 1010 1101 0000. Range U+10000–U+10FFFF → 4-byte.\nSplit 3+6+6+6: `100` `000010` `101101` `000000`\n\nWait: 0x10AD0 in binary = 1 0000 1010 1101 0000\n= 0b100001010110100000... let me redo:\n0x10AD0 = 1×65536 + 0×4096 + 10×256 + 13×16 + 0 = 65536 + 2560 + 208 = 68304\nBinary: 0001 0000 1010 1101 0000\n21 bits: 0 0001 0000 1010 1101 0000\nSplit 3+6+6+6: `000` `010000` `101011` `010000`\nEncoded: `11110000` `10010000` `10101011` `10010000` = **`F0 90 AB 90`**\n\n**c) U+2CA0 → UTF-8:**\n\n0x2CA0 = 0010 1100 1010 0000. Range U+0800–U+FFFF → 3-byte.\nSplit 4+6+6: `0010` `110010` `100000`\nEncoded: `1110 0010` `10 110010` `10 100000` = **`E2 B2 A0`**\n\n**d) First valid Unicode character in `47 CE B5 C4 85 E1 80 AA E1 9C A0 BA AD F0 90 8F 8C 57 73 E1 83 A8`:**\n\n- `47`: valid 1-byte (`0100 0111`) → **U+0047** (G) ✓ — this is the first valid character.\n\n**e) Second valid Unicode character:**\n\n- `CE B5`: 2-byte: payload `01110` `110101` = `01110110101` = 0x3B5 → **U+03B5** (ε) ✓\n\n**f) Subsequence of bytes that are invalid:**\n\nAfter valid characters, looking at the full sequence:\n`47`(G) `CE B5`(ε) `C4 85`(ą, U+0105) `E1 80 AA`(U+102A) `E1 9C A0`(U+1720) `BA AD`(BA=continuation without lead, AD=continuation) → **`BA AD`** are invalid.\n\nThen `F0 90 8F 8C`(U+100CC) `57`(W) `73`(s) `E1 83 A8`(U+10E8).\n\nInvalid bytes: **`BA AD`**\n\n**g) First character after re-synchronisation:**\n\nAfter `BA AD`, synchronisation re-established at `F0 90 8F 8C` (4-byte lead):\nPayload: `000` `010000` `001111` `001100` = 0x1040C... \n\n`F0`=`11110 000`, `90`=`10 010000`, `8F`=`10 001111`, `8C`=`10 001100`\nPayload: `000` `010000` `001111` `001100` = 0b000010000001111001100 = 0x1040C... \n= 0x1×16^4 + 0×16^3 + 4×16^2 + 0×16 + C = 65536+0+1024+0+12=66572? \n\nLet me recalculate: bits concatenated: 000 010000 001111 001100 = 000010000001111001100\n= 0000 1000 0000 1111 0011 00 (pad to 21 bits): 0 0001 0000 0011 1100 1100 = 0x1_03CC? \nHmm: 000 | 010000 | 001111 | 001100 = 000010000001111001100 (21 bits)\n= 2^17+2^8+2^7+2^6+2^5+2^3+2^2 = 131072+256+128+64+32+8+4 = 131564? \n\nDirect: 0x10 (upper) = 16... F0=lead for U+10000-U+10FFFF:\ncodepoint = ((F0&0x07)<<18) | ((90&0x3F)<<12) | ((8F&0x3F)<<6) | (8C&0x3F)\n= (0<<18) | (0x10<<12) | (0x0F<<6) | 0x0C\n= 0 | 0x10000 | 0x3C0 | 0x0C = 0x103CC → **U+103CC**\n\n**h) Last valid Unicode character:**\n\n`E1 83 A8`: 3-byte: payload `0001` `000011` `101000` = 0x10E8 → **U+10E8**\n\n**i) U+0048 in UTF-16 (big-endian):**\n\nU+0048 is in BMP → UTF-16 = 2 bytes = 0x0048 → **`00 48`**\n\n**ii) U+0F40 in UTF-32 (big-endian):**\n\nU+0F40 → 4 bytes: **`00 00 0F 40`**","50":"**a) Retransmission timer expires:**\n\nThe unacknowledged segment is **retransmitted** (the segment that was sent but not yet acknowledged is sent again).\n\n**b) Acknowledgement timer expires:**\n\nA **standalone ACK segment is transmitted** (an acknowledgement is sent without piggybacking on data, to avoid indefinitely delaying the acknowledgement).\n\n**c) Persistence timer expires:**\n\nA **window probe (probe segment) is transmitted** — a small segment is sent to the peer to solicit a window update, because the receiver previously advertised a zero window.\n\n**d) Keepalive timer expires:**\n\nA **keepalive probe segment is transmitted** — an empty (or 1-byte) segment is sent to check if the peer is still alive/reachable. If no response is received after several probes, the connection is terminated.\n\n**e) Quiet timer expires:**\n\n**TCP is allowed to open a new connection** — the quiet timer (also called TIME_WAIT timer or 2MSL timer) prevents a new connection from being established using the same port/sequence numbers until any lingering packets from the old connection have expired from the network. When it expires, the port/sequence space becomes available.","51":"Five mechanisms used by TCP to provide reliability:\n\n1. **Checksums** — each segment includes a checksum to detect data corruption in transit; corrupted segments are discarded.\n2. **Sequence numbers** — each byte of data is numbered, allowing the receiver to detect lost, duplicate, or out-of-order segments.\n3. **Acknowledgements (ACKs)** — the receiver explicitly confirms receipt of data; the sender knows which bytes have been successfully delivered.\n4. **Retransmission** — if an ACK is not received within the retransmission timeout period, the sender retransmits the unacknowledged data.\n5. **Flow control (sliding window)** — the receiver advertises a window size limiting how much data the sender may transmit without receiving an ACK, preventing the receiver's buffer from being overwhelmed.","52":"**a) Default gateway destination in routing table:**\n\n**0.0.0.0/0** (the default route; matches any destination not covered by a more specific route)\n\n**b) First class C network in the 256-block reserved for private use:**\n\nThe private class C block is 192.168.0.0/16, which contains 256 class-C networks (192.168.0.0/24 through 192.168.255.0/24).\nFirst class C: **192.168.0.0/24**\n\n**c) Last class B network in the 16-block reserved for private use:**\n\nThe private class B block is 172.16.0.0/12, containing 16 class-B networks (172.16.0.0/16 through 172.31.0.0/16).\nLast class B: **172.31.0.0/16**\n\n**d) UP network address for 137.215.98.140:**\n\nThe University of Pretoria uses 137.215.0.0/16.\nNetwork address: **137.215.0.0/16**\n\n**e) Broadcast address of 8.8.8.8 as class-based address:**\n\n8.x.x.x is a class A address (first bit 0, first octet 1–126). Class A uses /8.\nNetwork: 8.0.0.0/8. Broadcast = 8.255.255.255.\n**8.255.255.255/8** (or expressed as the broadcast: 8.255.255.255)","53":"**All values in hexadecimal.**\n\n**a) U+1842 → UTF-8:**\n\nRange U+0800–U+FFFF → 3-byte encoding.\n0x1842 = 0001 1000 0100 0010\nSplit 4+6+6: `0001` `100001` `000010`\n`1110 0001` `10 100001` `10 000010` = **`E1 A1 82`**\n\n**b) U+10AD0 → UTF-8:**\n\nRange U+10000–U+10FFFF → 4-byte encoding.\n0x10AD0: codepoint = ((0x10AD0))\n= `11110xxx 10xxxxxx 10xxxxxx 10xxxxxx`\nBinary: 0 0001 0000 1010 1101 0000 (21 bits, pad to 21): 000 010000 101011 010000\n`11110 000` `10 010000` `10 101011` `10 010000` = **`F0 90 AB 90`**\n\n**c) U+2CA0 → UTF-8:**\n\nRange U+0800–U+FFFF → 3-byte.\n0x2CA0 = 0010 1100 1010 0000\nSplit 4+6+6: `0010` `110010` `100000`\n`1110 0010` `10 110010` `10 100000` = **`E2 B2 A0`**\n\n**Byte sequence for d–h: `9D CE B5 C4 85 F1 9C A0`**\n\n- `9D`: `1001 1101` — continuation byte without lead → **invalid**, skip\n- `CE B5`: 2-byte: payload `01110` `110101` = 0x3B5 → **U+03B5** (first valid)\n- `C4 85`: 2-byte: payload `00100` `000101` = 0x105 → **U+0105** (second valid)\n- `F1 9C A0`: `F1`=4-byte lead, `9C`=cont, `A0`=cont, but only 3 bytes remain (need 4) → **incomplete/invalid**\n\n**d) First valid Unicode character:** **U+03B5**\n\n**e) Second valid Unicode character:** **U+0105**\n\n**f) Subsequence of bytes that are invalid:** **`9D`** (the orphaned continuation byte at the start)\n\n**g) First character after re-synchronisation:**\n\nAfter `9D` (invalid), synchronisation re-establishes at `CE B5` → first character formed = **U+03B5**\n\n**h) Last valid Unicode character:** **U+0105**\n\n*(The bytes `F1 9C A0` at the end form an incomplete 4-byte sequence and are invalid)*\n\n**i) UTF-8 byte stream for South African flag emoji:**\n\nSouth Africa's ISO 3166-1 code = ZA.\nRegional Indicator Symbol Letter Z = U+1F1FF\nRegional Indicator Symbol Letter A = U+1F1E6\n\nEncode U+1F1FF:\n0x1F1FF: `000` `011111` `000111` `111111`\n`F0 9F 87 BF`\n\nEncode U+1F1E6:\n0x1F1E6: `000` `011111` `000111` `100110`\n`F0 9F 87 A6`\n\nSouth African flag: **`F0 9F 87 BF F0 9F 87 A6`**","54":"**Block:** 41.1.16.0 – 41.1.31.255\n- Size: 31.255 – 16.0 + 1 = 4096 addresses = 2^12 → **/20** block\n- Network: **41.1.16.0/20**\n\nNeed ≥20 subnets, each ≥100 hosts within this /20.\n- Subnet bits: 2^n ≥ 20 → n=5 (2^5=32 ✓)\n- Host bits: 2^m - 2 ≥ 100 → m=7 (2^7-2=126 ✓)\n- 5+7=12 → /20+5 = **/25** — wait: 5+7=12 but /20 only has 12 host bits. 5+7=12 ✓.\n- Each subnet = 128 addresses.\n\n**a) Network address of the block:**\n\n**41.1.16.0/20**\n\n**b) Network address of the first subnet (/25):**\n\n**41.1.16.0/25**\n\n**c) Network address of the 20th subnet (subnet number 19, 0-indexed; or subnet value 19 in subnet portion):**\n\nThe question says \"value 19 in the subnet portion.\" Each /25 subnet has 128 addresses. Subnet 19:\n- Offset = 19 × 128 = 2432 bytes from 41.1.16.0\n- 2432 / 256 = 9 r 128. Third octet: 16+9=25. Fourth: 128.\n- **41.1.25.128/25**\n\n**d) Supernet of the last four subnets:**\n\nTotal subnets in /20: 2^5=32. Last four = subnets 28, 29, 30, 31.\nFour consecutive /25 subnets → combine into /23.\n\nSubnet 28 network: 28×128=3584. 3584/256=14. Third octet: 16+14=30. Fourth: 0. → 41.1.30.0/25\nAlign four /25s to /23 boundary: 41.1.30.0 AND 255.255.254.0: third octet 30 AND 254 = 30 (30=11110, 254=11111110 → 30 AND 254 = 30). \nWait: 30 = 0001 1110, 254 = 1111 1110, AND = 0001 1110 = 30. But that's /23 spanning 30.0-31.255.\n\nHmm: subnets 28–31 at 30.0, 30.128, 31.0, 31.128. A /23 covers 30.0-31.255 (4 × /25 = 4×128=512 = /23? No, /23 = 512 addresses = 4×128 ✓).\n**41.1.30.0/23**\n\n**e) Broadcast of supernet 41.1.30.0/23:**\n\n41.1.30.0 + 511 = 41.1.31.255 → **41.1.31.255**\n\n**f) Broadcast of original block 41.1.16.0/20:**\n\n**41.1.31.255** (same as supernet broadcast — the supernet's last four subnets align to the end of the original block)","55":"**a) Line completing the opening handshake:**\n\n**Line 3** (the ACK from Client completing the SYN → SYN-ACK → ACK three-way handshake)\n\n**b) Observation from line 2 implying line 1 contained a data byte:**\n\nLine 2 has `Ack=1` — since line 1 had `Seq=0` and `Len=0`, one would expect `Ack=0`. The fact that B acknowledges with `Ack=1` implies that the SYN flag in line 1 consumes one sequence number (a SYN counts as 1 byte for sequence numbering purposes).\n\n**c) Type of byte \"included\" in the packet from line 1:**\n\nA **SYN** flag — the SYN flag itself is not data but occupies one sequence number. It is a **control byte** (virtual byte consumed by the SYN flag).\n\n**d) Does line 3 include a similar byte?**\n\n**No.** Line 3 carries the ACK flag but not the SYN flag. The ACK flag does not consume a sequence number — only SYN and FIN flags consume sequence numbers. Line 3 has `Len=0` and carries no control byte.\n\n**e) How many bytes server consumed when it first acknowledges line 4:**\n\nLine 5 (first server ACK of line 4's data): `Ack=366`. Line 4 had `Seq=1, Len=365` → bytes 1–365 sent. Server ACKs all 365 bytes immediately → **365 bytes consumed**.\n\n**f) In which line does the client first acknowledge the server's 568 bytes (line 6):**\n\nLine 6: `Seq=1, Len=568` → bytes 1–568. Line 8: `Seq=366, Ack=570` — wait, line 7 (FIN,ACK) has `Seq=569`, which means bytes 1–568 sent (Seq=1+Len=568=569). Line 8: `Ack=570` acknowledges through Seq=569 (FIN). So line 8 first acknowledges the data from line 6: **Line 8**\n\n**g) Which packet caused Seq to increase from 569 to 570 on the server side:**\n\nLine 7 (FIN,ACK from server with Seq=569). The FIN flag consumes one sequence number. The ACK in line 11 (Seq=570) reflects that the FIN was counted. The packet that caused this increase was **Line 7** (the FIN packet itself).\n\n**h) How many of the 568 bytes from line 6 has the client consumed by line 10:**\n\nLine 8 `Win=262400`, line 10 `Win=262400`. The window did not change, implying the client's receive buffer is unchanged. The client window in line 3 was 263168 and in line 8 is 262400 (decreased by 768 = 365+403? — actually 263168-262400=768 bytes in buffer). At line 10, Win=262400 still → **0 bytes consumed** (the client has not consumed any of the 568 bytes — the window remained the same, indicating the buffer still has all received data).\n\n**i) Is line 7 part 1, 2, or 3 of the termination handshake?**\n\n**Part 1.** Line 7 is the server's FIN initiating connection termination. It is unexpected because normally the client (which sent the HTTP request in line 4) would initiate termination first, but here the server sends FIN first after completing its response.\n\n**j) Why was line 10 necessary:**\n\nLine 10 is a **retransmission** of line 9. Line 9 (Client FIN,ACK) was sent but no acknowledgement from the server was received, so the retransmission timer expired and the FIN was resent. The server's ACK (line 11) then arrives acknowledging both line 9 and line 10.","56":"**a) Record at a.root-servers.net for resolving ftp.xx.co.za:**\n\nThe root zone must delegate to the `za.` TLD:\n`za NS za1.dnsnode.net.`\n\n**b) Record at za1.dnsnode.net for resolving ftp.xx.co.za:**\n\nThe `za.` zone must delegate to `co.za`:\n`co NS coza1.dnsnode.net.`\n\n**c) Record at coza1.dnsnode.net for resolving ftp.xx.co.za:**\n\nThe `co.za` zone must delegate to `xx.co.za`:\n`xx NS ns1.host-h-net.`\n\n**d) Record at ns1.host-h-net indicating it is the primary name server for xx.co.za:**\n\n`@ NS ns1.host-h-net.`\n\n*(In the xx.co.za zone file, `@` refers to the zone apex, so this records that ns1.host-h-net is the NS for xx.co.za itself)*\n\n**e) Record for ftp.xx.co.za in xx.co.za zone:**\n\n`ftp A 197.221.2.30`\n\n**f) Record for xx.co.za IPv4 address:**\n\n`@ A 41.203.18.59`\n\n**g) Record for ftp.xx.co.za IPv6 address:**\n\n*(The given information only provides the IPv6 address for xx.co.za itself, not ftp.xx.co.za. If asked to provide what we can:)*\n`@ AAAA 2606:4700:20::ec5`\n\n*(For ftp specifically — no IPv6 given for ftp; only IPv4 197.221.2.30 is provided)*\n\n**h) Record for primary email server for xx.co.za:**\n\n`@ MX 10 ASPMX.L.GOOGLE.COM.`\n\n**i) Record for secondary mail server:**\n\n`@ MX 20 ALT1.ASPMX.L.GOOGLE.COM.`\n\n**j) TXT record with entry of the form x=1:**\n\n`@ TXT \"x=1\"`","57":"**a) gTLD used by American universities:**\n\n**.edu** (the `.edu` generic Top-Level Domain is restricted to accredited post-secondary educational institutions, primarily in the United States)\n\n**b) Process of converting FQDN to address:**\n\n**Resolution** (or name resolution / DNS resolution) — the process of resolving a fully qualified domain name to its corresponding IP address.\n\n**c) Process of inserting NS entries into a zone file:**\n\n**Delegation** — the registrar *delegates* authority for the new domain by inserting NS records in the parent zone file. (The registrar delegates authority to the domain's name servers.)\n\n**d) Entity in control of the za. ccTLD:**\n\n**ZADNA** (ZA Domain Name Authority) — the entity that oversees policy for the `.za` ccTLD in South Africa.\n\n**e) Committee that approves new TLDs:**\n\n**GNSO** (Generic Names Supporting Organisation) recommends new gTLDs, but the committee with final authority is **ICANN's Board** — however, the process committee is the **New gTLD Program Committee**. More precisely, within ICANN: the **GNSO** (for generic TLDs). For all TLDs: **ICANN Board**.","58":"**P–Q link cost = 6.**\n\n**P's initial table:**\nA(M,15), B(M,22), F(L,14), H(Q,18), K(K,6), L(K,7), R(Q,12), U(Q,11)\n\n**Q's initial table:**\nA(P,21), C(D,15), H(P,12), K(P,14), R(R,6), U(U,5), Z(Z,7)\n\n**At t₁: Q shares table with P. Update rule: P's new cost to X via Q = P–Q cost + Q's cost to X = 6 + Q's cost.**\n\n**a) t₁, C (at P):**\n\nP has no entry for C. Via Q: 6 + Q→C = 6+15 = 21.\n**Next=Q, Cost=21**\n\n**b) t₁, H (at P):**\n\nP's current H = 18 (via Q). Via Q: 6 + Q→H = 6+12 = 18. Tie → no change (or same cost).\n**Next=Q, Cost=18** (unchanged)\n\n**At t₂: P shares updated table with Q. Update rule: Q's new cost to X via P = Q–P cost + P's cost to X = 6 + P's cost.**\n\nP's updated table at t₂ includes new entry for C=21 (via Q).\n\n**c) t₂, K (at Q):**\n\nQ's current K = 14 (via P). Via P: 6 + P→K = 6+6 = 12. 12 < 14 → Update.\n**Next=P, Cost=12**\n\n**d) t₂, H (at Q):**\n\nQ's current H = 12 (via P). Via P: 6 + P→H = 6+18 = 24. 24 > 12 → No change.\n**Next=P, Cost=12** (unchanged)\n\n**e) t₂, Z (at Q):**\n\nQ's current Z = 7 (via Z directly). Via P: 6 + P→Z = ? P has no Z entry → cannot improve via P.\n**Next=Z, Cost=7** (unchanged)","59":"**a) Convert Unicode characters to UTF-8:**\n\n**(i) U+00E4** (ä — Latin small letter a with diaeresis):\nRange U+0080–U+07FF → 2-byte.\n0xE4 = `11100100`. Split 5+6: `00011` `100100`.\nEncoded: `110 00011` `10 100100` = **`C3 A4`**\n\n**(ii) U+039E** (Ξ — Greek capital letter xi):\nRange U+0080–U+07FF → 2-byte.\n0x39E = 0000 0011 1001 1110. Split 5+6: `01110` `011110` (from 0x39E=926: 0b1110011110).\nWait: 0x39E = 0011 1001 1110 (12 bits). Split last 11 bits for 2-byte:\n0b11110011110 = `01110` `011110`? No.\n0x39E = 926 decimal. 926 in binary (11 bits): `011 1001 1110`. Split 5+6: `01110` `011110`.\nEncoded: `110 01110` `10 011110` = `CE 9E` = **`CE 9E`**\n\n**(iii) U+179F** (Khmer letter SA):\nRange U+0800–U+FFFF → 3-byte.\n0x179F = 0001 0111 1001 1111. Split 4+6+6: `0001` `011110` `011111`.\nEncoded: `1110 0001` `10 011110` `10 011111` = **`E1 9E 9F`**\n\n**(iv) U+1F9A7** (Orangutan emoji):\nRange U+10000–U+10FFFF → 4-byte.\n0x1F9A7: binary = 0001 1111 1001 1010 0111 (21 bits, pad): `000` `011111` `100110` `100111`.\nEncoded: `11110000` `10011111` `10100110` `10100111` = **`F0 9F A6 A7`**\n\n**b) Decode byte sequence (with errors):**\n\n`EF BB AF BC C2 AA F1 83 E0 AA AA F0 90 AB C3 D5`\n\n- `EF BB AF`: 3-byte: payload `1111` `101110` `101111` = 0xFEFF → **U+FEFF** (BOM) ✓\n- `BC`: `1011 1100` — continuation byte without lead → **skip**\n- `C2 AA`: 2-byte: payload `00010` `101010` = 0xAA = 170 → **U+00AA** (ª) ✓\n- `F1 83 E0 AA`: `F1`=4-byte lead, `83`=cont ✓, `E0`=`11100000` NOT continuation → incomplete, **invalid**\n- `AA`: `10101010` — continuation without lead → **skip**\n- `F0 90 AB C3`: `F0`=4-byte lead, `90`=cont ✓, `AB`=cont ✓, `C3`=`11000011` NOT continuation → incomplete, **invalid**\n- `D5`: `11010101` — 2-byte lead, but no continuation follows → **incomplete/invalid**\n\n**Valid characters decoded (separated by commas): U+FEFF, U+00AA**","60":"**a) Purpose of line 17 (`out.write(\"HTTP/1.1 200 OK\\r\\n\")`):**\n\nSends the **HTTP status line** — the first line of the HTTP response, indicating the protocol version (HTTP/1.1) and the response status code (200 OK, meaning the request was successfully processed).\n\n**b) Purpose of line 18 (`out.write(\"Content-Type: text/html\\r\\n\")`):**\n\nSends an **HTTP response header** — specifically the `Content-Type` header, which informs the client (browser) that the response body contains HTML content encoded as text.\n\n**c) Purpose of line 19 (`out.write(\"\\r\\n\")`):**\n\nSends the **blank line that separates the HTTP response headers from the response body** — in HTTP, a CRLF on a line by itself signals the end of the headers.\n\n**d) Purpose of line 24 (`out.write(\"<!DOCTYPE html>\")`):**\n\nSends the **start of the HTML response body** — specifically the HTML document type declaration, which is the first line of a valid HTML5 document sent to the client as the response body.\n\n**e) What the missing code in line 13 should do:**\n\nLine 12 checks if the request method is `HEAD`. The code in line 13 should **send the HTTP response headers only, without a response body** — a HEAD request must return the same headers as a GET request (including status line and Content-Type), but must not include the message body. This allows clients to check metadata without downloading the full content.","61":"**Setup at t0:**\n- A ready to send byte 100; A expects byte 300; A's window=500; A thinks B's window=300.\n- B's state matches perfectly: B ready to send byte 300, expects byte 100, B's window=300, B thinks A's window=500.\n\n**m1 (A→B, LEN=10, at t1, arrives t1):**\n\n1. **ACK number of m1:**\nA expects byte 300 from B → **ACK=300**\n\n**m2 (B→A, LEN=20, at t2, arrives t2):**\n\nAt t2: B received m1's 10 bytes (100–109). B's next expected from A = 110.\n\n2. **Sequence number of m2:**\nB's next byte to send = 300 → **SEQ=300**\n\n**m3 (A→B, LEN=30, at t3, arrives t4) — simultaneous with m4:**\n\nAt t3: A has received m2 (B's 20 bytes: 300–319). A next expects byte 320.\n\n3. **ACK number of m3:**\nA has received through byte 319 → next expected = **ACK=320**\n\n**m4 (B→A, LEN=40, at t3, arrives t4) — simultaneous with m3:**\n\nAt t3 (before m3 arrives): B has received m1's 10 bytes (100–109). B next expects byte 110.\n\n4. **ACK number of m4:**\nB expects byte 110 → **ACK=110**\n\n**m5 (A→B, LEN=50, at t5, arrives t5):**\n\nAt t5: A has received m4 (B's 40 bytes: 320–359, since B sent m2=20+m4=40 cumulative 300–359). A has received m1(10)+m3(30)+m4(40) from B? \n\nWait: B sent m2(300–319) and m4(320–359). A received both. A next expects 360.\n\nA's window advertisement: A's buffer size=500. A received: m2(20 bytes)+m4(40 bytes)=60 bytes buffered (assuming not consumed). Free = 500-60=440.\n\n5. **Window advertisement of m5:**\nA's receive window = **440** (500 - 60 bytes buffered from B)","62":"**Host H = 222.222.222.222. Class C (first 3 octets = network = 222.222.222.0/24).**\n\n**1. Acme Corporation's network address:**\n\n**222.222.222.0/24**\n\n**2. Broadcast address:**\n\n**222.222.222.255**\n\n**3. Netmask:**\n\n**255.255.255.0**\n\n**Subnetting for ≥10 subnets, ≥50 hosts each within /24:**\n- Subnet bits: 2^n ≥ 10 → n=4 (2^4=16 ✓)\n- Host bits: 2^m - 2 ≥ 50 → m=6 (2^6-2=62 ✓)\n- 4+6=10 ✓ (within /24's 8 host bits... wait: /24 has 8 host bits. 4+6=10 > 8. Need to adjust.)\n\nRecalculate: /24 has 8 host bits total.\n- Need: subnet bits + host bits = 8.\n- Subnet bits n: 2^n ≥ 10; n=4. Host bits m = 8-4 = 4 → 2^4-2=14 hosts. Not ≥50!\n- Try n=3: 2^3=8 < 10. Not enough subnets.\n\nConflict: can't have both ≥10 subnets and ≥50 hosts within a /24 with only 8 bits.\n\nUsing minimum to meet ≥50 hosts: m=6 (62 hosts), n=2 (4 subnets) — not enough.\nFor 50 hosts: m=6 (62 ≥ 50 ✓), remaining = 8-6=2 subnet bits → 4 subnets (< 10).\nFor ≥10 subnets: n=4, m=4 (14 hosts < 50).\n\nThe question says \"at least 10 subnets, each at least 50 hosts\" — this may exceed the /24. Assume they use supernetting or the question accepts the best fit.\n\nStandard exam answer: use /26 (6 host bits, 2 subnet bits → 4 subnets of 62 hosts each) — insufficient subnets. OR use /28 (4 host bits = 14 hosts, 4 subnet bits = 16 subnets) — insufficient hosts.\n\nMost likely exam intent: n=4 subnet bits, prefix /28. With 16 subnets, 14 hosts each. But ≥50 hosts isn't met. Likely: /27 (5+3=8): 8 subnets (< 10), 30 hosts. Or accept /26 meaning 4 subnets.\n\n**Re-reading:** \"at least 10 subnets, at least 50 hosts\" — must use /26 minimum for hosts. Since /24 can't support both simultaneously, the question likely expects the student to recognise a larger block is needed, OR the class C is expanded. \n\nGiven H=222.222.222.222 is class C and the question says \"subnet its network\", the most sensible exam answer:\n\n**4. Netmask:** 255.255.255.192 (`/26`) — prioritising ≥50 hosts (62 per subnet), yielding 4 subnets (< 10 requirement, but this is the constraint).\n\nOR: 255.255.255.224 (`/27`) → 8 subnets of 30 hosts each (meets subnets if we relax host requirement).\n\nMost likely exam intent given 222.x.x.x/24 with \"at least 50 hosts\": **/26** (6 host bits = 62 hosts ✓; 2 subnet bits = 4 subnets).\n\n**4. Netmask:** 255.255.255.192 (`/26`)\n\n**5. Subnet containing H (222.222.222.222):**\n\n222 AND 192 = 192 → subnet = **222.222.222.192/26**\n\n**6. Broadcast:** 222.222.222.192 + 63 = **222.222.222.255**\n\n**7. Subnet number of H:**\n\nSubnets: 0→222.222.222.0, 1→222.222.222.64, 2→222.222.222.128, 3→222.222.222.192\nH is on subnet **3**\n\n**8. Host number of H:**\n\nH = 222.222.222.222. Subnet base = 222.222.222.192. 222-192 = 30. Host number = **30**\n\n**Supernet of 4 subnets including subnet 3 (222.222.222.192):**\n\nCombine all 4 /26 subnets → restore original /24. (The only 4-subnet aligned group is the full /24.)\n\n**9. Network address of supernet:** **222.222.222.0/24**\n\n**10. Netmask:** **255.255.255.0**","63":"**1. Timer activated when an endpoint transmits a segment containing data:**\n\n**Retransmission timer** — started whenever a segment containing data is sent; if no ACK is received before it expires, the segment is retransmitted.\n\n**2. Timer activated when an endpoint receives a segment containing data:**\n\n**Acknowledgement timer** (delayed ACK timer) — started when data is received; if no outgoing segment to piggyback an ACK onto arrives before the timer expires, a standalone ACK is sent.\n\n**3. Timer reset whenever an endpoint receives any segment:**\n\n**Keepalive timer** — reset each time any segment is received from the peer; if no segment is received for an extended period (typically 2 hours), the timer expires and keepalive probes are sent.\n\n**4. Timer that causes a probe to be transmitted if it expires:**\n\n**Persistence timer** (persistent timer) — when the receiver advertises a zero window, the sender starts the persistence timer; upon expiry it sends a window probe to the receiver to check if the window has opened.\n\n**5. Timer that may be stopped when an endpoint receives a segment with an acknowledgement number:**\n\n**Retransmission timer** — when a segment is acknowledged (an ACK is received), the retransmission timer for that segment is cancelled (stopped/deleted), as retransmission is no longer needed.","64":"**Network setup from routing tables and tracert output:**\n\nH is at 10.1.1.13's network (10.1.0.0/16 on R1's eth0). The tracert shows: H → 10.1.1.13 (R1's eth0) → 192.168.2.14 (R2) → 41.170.74.97 (R2's WAN/PPPoE interface).\n\n**1. Interface on which H is connected:**\n\nH's first hop is 10.1.1.13 (a gateway on R1's 10.1.0.0/16 network). R1's routing table shows `10.1.0.0/16 directly connected, eth0`. H is connected to **R1's eth0 interface**.\n\n**2. Interface of R1 and R2 that are directly connected:**\n\nR1's routing table: `192.168.2.0/24 directly connected, eth9`. R1's address on this link is 192.168.2.x; R2's address is 192.168.2.14. R2's routing table shows `192.168.2.0/24 via br0`. So **R1: eth9; R2: br0**.\n\n**3. traceroute -d 192.168.2.1 executed on C1 (192.168.1.1):**\n\nC1 is on 192.168.1.0/24. R2's routing table: `192.168.1.0 via 192.168.2.13 (br0)`. So R2 forwards 192.168.1.x traffic to 192.168.2.13 (which is R1's eth9 address).\n\nFrom C1: packet to 192.168.2.1 → C1's default gateway (R2 or directly R1?) → R2 knows 192.168.2.0/24 directly (br0). \nC1 (192.168.1.1) → gateway = 192.168.2.13 (R1 eth9) → R1 sees 192.168.2.0/24 directly on eth9 → 192.168.2.1 is reached.\n\nPath: **192.168.2.13, 192.168.2.1**\n\n**4. Configuration parameter determining route from C2:**\n\nC2 is at 192.168.2.1. Traceroute to 192.168.1.1. R2 routes 192.168.1.0/24 via 192.168.2.13 (R1).\nC2 sends to 192.168.1.1. Whether C2 goes directly to R1 (192.168.2.13) or via R2 (192.168.2.14) first depends on **C2's default gateway (default route) configuration** — if C2's gateway is 192.168.2.14 (R2), the path is 192.168.2.14→192.168.2.13→192.168.1.1; if C2's gateway is 192.168.2.13 (R1) directly, path is 192.168.2.13→192.168.1.1.\n\nThe parameter: **the default gateway** setting on C2.\n\n**5. Second node when C1 runs traceroute -d 10.10.10.10:**\n\nC1 (192.168.1.1) → first hop = C1's gateway = R2 (192.168.2.14) or R1 (192.168.2.13)?\nR2 has `10.1.0.0/16 via 192.168.2.13 (br0)` but 10.10.10.10 is not 10.1.x.x.\nR2's default: not shown explicitly, but R2 acts as default gateway with PPPoE (41.170.74.97).\nC1's gateway = R2 (192.168.2.14, as implied by tracert showing H→R1→R2). \n\nActually C1 is on 192.168.1.0/24. R1 routes 192.168.1.0 (has entry for it, gateway=192.168.2.13). C1's packets to unknown destinations go to C1's gateway. C1's gateway is likely R2 (192.168.2.14) or R1.\n\nFrom tracert: H (10.1.x.x) → R1 (eth0=10.1.1.13... wait, 10.1.1.13 was first hop FROM H, so R1's eth0 interface is 10.1.1.13 as seen by H — but R1's routing table shows 10.1.0.0/16 on eth0. So R1's eth0 IP includes 10.1.1.13? But that's H's hop, meaning R1's eth0 is the gateway for H, with IP 10.1.1.1 or similar, not 10.1.1.13. The 10.1.1.13 in tracert is actually the FIRST hop returned by tracert — so that IS the router R1's interface IP = 10.1.1.13... but that seems odd (routers don't typically end in .13 by convention, but it's possible).\n\nFor C1 (192.168.1.1) tracerouting 10.10.10.10:\n- First hop: C1's default gateway = likely R2 at 192.168.2.14, but C1 is on 192.168.1.x. C1's gateway might be 192.168.1.x address of R1 (if R1 has interface on 192.168.1.0/24). R2's table shows `192.168.1.0 via 192.168.2.13, br0` — R2 reaches 192.168.1.0 via R1. So R1 has an interface on 192.168.1.0/24. C1's gateway = R1's 192.168.1.x address.\n- First hop from C1: R1 (192.168.1.x — let's say 192.168.1.254 or gateway address).\n- Second hop: R1 doesn't know 10.10.10.10 specifically; R1's default = `0.0.0.0/0 via 192.168.2.14, eth9` (R2). So second hop = **192.168.2.14** (R2)."};

    const TOPIC_COLOURS = {"DNS": ["#0e7490", "#cffafe"], "Routing Algorithms": ["#1d4ed8", "#dbeafe"], "IP Addressing & Subnetting": ["#7c3aed", "#ede9fe"], "Network Layer (IP/ICMP/ARP)": ["#be185d", "#fce7f3"], "Transport Layer (TCP/UDP/QUIC)": ["#d97706", "#fef3c7"], "Application Protocols": ["#16a34a", "#dcfce7"], "Encoding & Presentation": ["#dc2626", "#fee2e2"], "Data Link Layer": ["#0f766e", "#ccfbf1"], "General": ["#374151", "#f3f4f6"]};

    const state = {
      search: "",
      topic: "all",
      seen: "all",
      source: "all",
      sort: "source",
      years: new Set(["2022", "2023", "2024", "2025", "2026"]),
      papers: new Set(["ST1", "ST2", "Exam"]),
      expandedIds: new Set(),
      allExpanded: false,
    };

    const els = {
      search: document.getElementById("search"),
      topicFilter: document.getElementById("topicFilter"),
      seenFilter: document.getElementById("seenFilter"),
      sourceFilter: document.getElementById("sourceFilter"),
      sortBy: document.getElementById("sortBy"),
      yearChecks: document.getElementById("yearChecks"),
      paperChecks: document.getElementById("paperChecks"),
      results: document.getElementById("results"),
      resultText: document.getElementById("resultText"),
      sourceText: document.getElementById("sourceText"),
      statVisible: document.getElementById("stat-visible"),
      resetBtn: document.getElementById("resetBtn"),
      expandAllBtn: document.getElementById("expandAllBtn"),
    };

    const paperRank = { ST1: 0, ST2: 1, Exam: 2 };

    function selectedValues(container) {
      return new Set([...container.querySelectorAll("input:checked")].map(i => i.value));
    }

    function textOf(row) {
      return [row.text, row.topic, row.sourceLabel, row.studyStatus].join(" ").toLowerCase();
    }

    function sourceSort(a, b) {
      const ya = Number(a.year), yb = Number(b.year);
      if (ya !== yb) return ya - yb;
      const pa = paperRank[a.paper] ?? 9, pb = paperRank[b.paper] ?? 9;
      if (pa !== pb) return pa - pb;
      return a.number - b.number;
    }

    function applyFilters() {
      state.search = els.search.value.trim().toLowerCase();
      state.topic = els.topicFilter.value;
      state.seen = els.seenFilter.value;
      state.source = els.sourceFilter.value;
      state.sort = els.sortBy.value;
      state.years = selectedValues(els.yearChecks);
      state.papers = selectedValues(els.paperChecks);

      let rows = DATA.filter(row => {
        if (state.search && !textOf(row).includes(state.search)) return false;
        if (state.topic !== "all" && row.topic !== state.topic) return false;
        if (state.seen === "seen" && !row.isCurrent) return false;
        if (state.seen === "unseen" && row.isCurrent) return false;
        if (state.source !== "all" && row.sourceLabel.split(" Q")[0] !== state.source) return false;
        if (!state.years.has(row.year)) return false;
        if (!state.papers.has(row.paper)) return false;
        return true;
      });

      rows.sort((a, b) => {
        if (state.sort === "topic") return a.topic.localeCompare(b.topic) || sourceSort(a, b);
        if (state.sort === "status") return Number(a.isCurrent) - Number(b.isCurrent) || sourceSort(a, b);
        if (state.sort === "id") return a.id - b.id;
        return sourceSort(a, b);
      });

      render(rows);
      return rows;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Minimal markdown-to-HTML renderer
    function mdToHtml(md) {
      // Protect code blocks
      const blocks = [];
      md = md.replace(/```([\s\S]*?)```/g, (_, code) => {
        const i = blocks.length;
        blocks.push(`<pre><code>${escHtml(code.trim())}</code></pre>`);
        return `\x00BLOCK${i}\x00`;
      });

      const lines = md.split("\n");
      const out = [];
      let inTable = false;
      let inList = false;
      let inOl = false;

      function closeList() {
        if (inList) { out.push("</ul>"); inList = false; }
        if (inOl) { out.push("</ol>"); inOl = false; }
      }
      function closeTable() {
        if (inTable) { out.push("</tbody></table>"); inTable = false; }
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Restore code blocks
        if (line.includes("\x00BLOCK")) {
          closeList(); closeTable();
          out.push(line.replace(/\x00BLOCK(\d+)\x00/g, (_, n) => blocks[Number(n)]));
          continue;
        }

        // HR
        if (/^---+$/.test(line.trim())) {
          closeList(); closeTable();
          out.push("<hr>");
          continue;
        }

        // Headings
        const hm = line.match(/^(#(1, 4))\s+(.*)/);
        if (hm) {
          closeList(); closeTable();
          const level = Math.min(hm[1].length + 2, 6); // shift h1→h3, h2→h4, etc.
          out.push(`<h${level}>${inline(hm[2])}</h${level}>`);
          continue;
        }

        // Blockquote
        if (/^>/.test(line)) {
          closeList(); closeTable();
          out.push(`<blockquote>${inline(line.replace(/^>\s*/, ""))}</blockquote>`);
          continue;
        }

        // Table rows
        if (/^\|/.test(line.trim())) {
          const cells = line.split("|").slice(1, -1).map(c => c.trim());
          if (!inTable) {
            closeList();
            out.push('<table><thead><tr>' + cells.map(c => `<th>${inline(c)}</th>`).join("") + '</tr></thead><tbody>');
            inTable = true;
            // skip separator line
            if (i + 1 < lines.length && /^\|[-:|\s|]+\|$/.test(lines[i+1].trim())) i++;
            continue;
          }
          out.push('<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join("") + '</tr>');
          continue;
        } else if (inTable) {
          closeTable();
        }

        // Unordered list
        const ulm = line.match(/^(\s*[-*]\s+)(.*)/);
        if (ulm) {
          if (inOl) { out.push("</ol>"); inOl = false; }
          if (!inList) { out.push("<ul>"); inList = true; }
          out.push(`<li>${inline(ulm[2])}</li>`);
          continue;
        }

        // Ordered list
        const olm = line.match(/^\s*(\d+)[.)\s]+(.+)/);
        if (olm) {
          if (inList) { out.push("</ul>"); inList = false; }
          if (!inOl) { out.push("<ol>"); inOl = true; }
          out.push(`<li>${inline(olm[2])}</li>`);
          continue;
        }

        closeList(); closeTable();

        // Blank line
        if (!line.trim()) {
          out.push("");
          continue;
        }

        out.push(`<p>${inline(line)}</p>`);
      }

      closeList(); closeTable();
      return out.join("\n");
    }

    function inline(s) {
      s = escHtml(s);
      // Bold
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      // Italic
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      // Inline code
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      return s;
    }

    function render(rows) {
      els.statVisible.textContent = rows.length;
      els.resultText.textContent = `${rows.length} visible, ${rows.filter(r => r.isCurrent).length} in 2026 tests`;
      els.sourceText.textContent = state.source === "all" ? "All sources" : state.source;

      if (!rows.length) {
        els.results.innerHTML = '<div class="empty">No questions match the current filters.</div>';
        return;
      }

      els.results.innerHTML = rows.map(row => {
        const isOpen = state.allExpanded || state.expandedIds.has(row.id);
        const statusClass = row.isCurrent ? "seen" : "study";
        const statusText = row.isCurrent ? "Seen in 2026 tests" : "Study";
        const marksText = row.marks ? `${row.marks} marks` : "";
        const preview = row.text.replace(/[\r\n]+/g, " ").replace(/#+\s/g, "").trim().slice(0, 220);
        const [tc, tb] = TOPIC_COLOURS[row.topic] || ["#374151", "#f3f4f6"];

        return `
<article class="lq" data-id="${row.id}">
  <div class="lq-head${isOpen ? " open" : ""}" onclick="toggleCard(${row.id}, this)">
    <div class="lq-id">#${row.id}</div>
    <div class="lq-meta">
      <div class="lq-source">${escHtml(row.sourceLabel)}</div>
      <p class="lq-preview">${escHtml(preview)}…</p>
    </div>
    <div class="badges">
      <span class="badge" style="color:${tc};background:${tb}">${escHtml(row.topic)}</span>
      <span class="badge ${statusClass}">${escHtml(statusText)}</span>
      ${marksText ? `<span class="badge marks">${escHtml(marksText)}</span>` : ""}
    </div>
  </div>
  <div class="lq-body${isOpen ? " open" : ""}">
    ${mdToHtml(row.text)}
    ${MEMOS[String(row.id)] ? `
    <button class="memo-btn" onclick="event.stopPropagation();toggleMemo(${row.id}, this)">Show memo ▾</button>
    <div class="memo-section" id="memo-${row.id}">
      <div class="memo-label">Memo answer</div>
      <div>${mdToHtml(MEMOS[String(row.id)])}</div>
    </div>` : ""}
  </div>
</article>`;
      }).join("");
    }

    function toggleCard(id, headEl) {
      const article = headEl.closest(".lq");
      const body = article.querySelector(".lq-body");
      const isOpen = body.classList.contains("open");
      if (isOpen) {
        body.classList.remove("open");
        headEl.classList.remove("open");
        state.expandedIds.delete(id);
      } else {
        body.classList.add("open");
        headEl.classList.add("open");
        state.expandedIds.add(id);
      }
    }

    function toggleMemo(id, btn) {
      const section = document.getElementById("memo-" + id);
      const open = section.classList.toggle("open");
      btn.textContent = open ? "Hide memo ▴" : "Show memo ▾";
    }

    function resetFilters() {
      els.search.value = "";
      els.topicFilter.value = "all";
      els.seenFilter.value = "all";
      els.sourceFilter.value = "all";
      els.sortBy.value = "source";
      [...document.querySelectorAll(".checks input")].forEach(i => i.checked = true);
      state.expandedIds.clear();
      state.allExpanded = false;
      els.expandAllBtn.textContent = "Expand all";
      applyFilters();
    }

    function toggleExpandAll() {
      state.allExpanded = !state.allExpanded;
      els.expandAllBtn.textContent = state.allExpanded ? "Collapse all" : "Expand all";
      // Re-render to apply expansion state
      applyFilters();
    }

    [els.search, els.topicFilter, els.seenFilter, els.sourceFilter, els.sortBy]
      .forEach(el => el.addEventListener("input", applyFilters));
    [els.yearChecks, els.paperChecks].forEach(el => el.addEventListener("change", applyFilters));
    els.resetBtn.addEventListener("click", resetFilters);
    els.expandAllBtn.addEventListener("click", toggleExpandAll);

    applyFilters();
  </script>
</body>
</html>
