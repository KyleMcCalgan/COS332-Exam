<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COS332 MCQ Explorer</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #5d6978;
      --line: #d9dee7;
      --accent: #0f766e;
      --accent-soft: #d7f3ef;
      --warn: #a16207;
      --warn-soft: #fff0c2;
      --shadow: 0 10px 30px rgba(23, 32, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .wrap {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 0 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(110px, 1fr));
      gap: 10px;
      min-width: 380px;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat b {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    main {
      padding: 18px 0 32px;
    }

    .filters {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 16px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) minmax(160px, 0.7fr) minmax(160px, 0.7fr) minmax(180px, 0.8fr);
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input[type="search"],
    select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 40px;
      align-items: center;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: #fff;
      font-size: 13px;
      white-space: nowrap;
    }

    .check input {
      margin: 0;
      accent-color: var(--accent);
    }

    .filter-row {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) minmax(160px, 0.5fr);
      gap: 12px;
      margin-top: 12px;
      align-items: end;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    button {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .result-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 10px 0 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .view {
      display: grid;
      gap: 10px;
    }

    .mcq {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(23, 32, 42, 0.05);
      overflow: hidden;
    }

    .mcq-head {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .mcq-id {
      width: 42px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #edf1f5;
      color: #344054;
      font-weight: 700;
      font-size: 13px;
    }

    .question {
      margin: 0;
      font-size: 15px;
      line-height: 1.48;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 4px 8px;
      background: #eef2f7;
      color: #344054;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.seen {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge.review {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .mcq-body {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(220px, 0.72fr);
      gap: 14px;
      padding: 14px;
    }

    .options {
      margin: 0;
      padding-left: 0;
      list-style: none;
      display: grid;
      gap: 7px;
    }

    .options li {
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      font-size: 14px;
      line-height: 1.35;
    }

    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e6ebf2;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.35;
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
      transition: background 0.12s, border-color 0.12s;
    }

    .option-btn:hover:not(:disabled) {
      background: #eef2f7;
      border-color: #c5cdd9;
    }

    .option-btn.correct {
      background: #d1fae5;
      border-color: #34d399;
      color: #065f46;
      font-weight: 700;
    }

    .option-btn.incorrect {
      background: #fee2e2;
      border-color: #f87171;
      color: #991b1b;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .quiz-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .quiz-result {
      font-size: 13px;
      font-weight: 700;
    }

    .quiz-result.correct { color: #065f46; }
    .quiz-result.incorrect { color: #991b1b; }
    .quiz-result.unknown { color: var(--muted); }

    .reset-btn {
      height: 28px;
      font-size: 12px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
    }

    .reset-btn:hover { background: #f1f5f9; }

    .detail {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .detail-block {
      border-left: 3px solid var(--line);
      padding-left: 10px;
    }

    .detail-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .detail-text {
      font-size: 13px;
      line-height: 1.4;
    }

    .empty {
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 960px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .stats {
        min-width: 0;
      }

      .filter-grid,
      .filter-row,
      .mcq-body {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        width: min(100% - 20px, 1440px);
      }

      .topbar {
        padding-top: 18px;
      }

      h1 {
        font-size: 23px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .filters {
        padding: 12px;
      }

      .mcq-head {
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .badges {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1>COS332 MCQ Explorer</h1>
        <p class="subtitle">Filter, sort, and review deduplicated MCQs from the past paper markdown set.</p>
      </div>
      <div class="stats">
        <div class="stat"><b id="stat-total">222</b><span>unique questions</span></div>
        <div class="stat"><b id="stat-visible">222</b><span>visible now</span></div>
        <div class="stat"><b id="stat-seen">0</b><span>seen in 2026 tests</span></div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="filters" aria-label="Filters">
        <div class="filter-grid">
          <div>
            <label for="search">Search</label>
            <input id="search" type="search" placeholder="Search question text, options, or source">
          </div>
          <div>
            <label for="seen">Seen status</label>
            <select id="seen">
              <option value="all">All questions</option>
              <option value="unseen">Only learn / review</option>
              <option value="seen">Only seen in 2026 tests</option>
            </select>
          </div>
          <div>
            <label for="sort">Sort</label>
            <select id="sort">
              <option value="source">First source</option>
              <option value="occurrences-desc">Most repeated</option>
              <option value="occurrences-asc">Least repeated</option>
              <option value="status">Study status</option>
              <option value="question">Question text</option>
              <option value="id">Table order</option>
            </select>
          </div>
          <div>
            <label for="source">Specific paper</label>
            <select id="source">
              <option value="all">All papers</option>
              <option value="2022 Exam">2022 Exam (25)</option><option value="2022 ST2">2022 ST2 (25)</option><option value="2023 ST1">2023 ST1 (20)</option><option value="2023 ST2">2023 ST2 (20)</option><option value="2023 Exam">2023 Exam (50)</option><option value="2024 ST1">2024 ST1 (20)</option><option value="2024 ST2">2024 ST2 (25)</option><option value="2024 Exam">2024 Exam (50)</option><option value="2025 ST1">2025 ST1 (20)</option><option value="2025 ST2">2025 ST2 (25)</option><option value="2025 Exam">2025 Exam (50)</option><option value="2026 ST1">2026 ST1 (20)</option><option value="2026 ST2">2026 ST2 (25)</option>
            </select>
          </div>
        </div>

        <div class="filter-row">
          <div>
            <label>Years</label>
            <div class="checks" id="yearChecks">
              <label class="check"><input type="checkbox" value="2022" checked> 2022</label><label class="check"><input type="checkbox" value="2023" checked> 2023</label><label class="check"><input type="checkbox" value="2024" checked> 2024</label><label class="check"><input type="checkbox" value="2025" checked> 2025</label><label class="check"><input type="checkbox" value="2026" checked> 2026</label>
            </div>
          </div>
          <div>
            <label>Paper types</label>
            <div class="checks" id="paperChecks">
              <label class="check"><input type="checkbox" value="ST1" checked> ST1</label><label class="check"><input type="checkbox" value="ST2" checked> ST2</label><label class="check"><input type="checkbox" value="Exam" checked> Exam</label>
            </div>
          </div>
          <div class="actions">
            <button id="reset" type="button">Reset</button>
            <button id="copyVisible" class="primary" type="button">Copy visible</button>
          </div>
        </div>
      </section>

      <div class="result-meta">
        <span id="resultText"></span>
        <span id="sourceText"></span>
      </div>

      <section id="results" class="view" aria-live="polite"></section>
    </div>
  </main>

age.", "C. The server accepts the requests, discards the message, and sends an error message to `a@xx.co.za`.", "D. The server continues the interaction, but reports that it does not relay messages. The message is never accepted.", "E. None of the above, because it is impossible to find SMTP servers that will initiate a conversation without first requiring login credentials."], "occurrences": ["2024 ST1 Q1.i"], "sourceLabels": ["2024 ST1"], "years": ["2024"], "papers": ["ST1"], "firstSource": "2024 ST1 Q1.i", "firstYear": "2024", "firstPaper": "ST1", "occurrenceCount": 1, "askedCurrent": false, "askedCurrentSources": [], "studyStatus": "Learn / review", "correctAnswer": "D", "answerSource": "memo"}, {"id": 115, "question": "When an email is sent using SMTP the `From:` header displayed to the recipient is, in the vast majority of cases, based on:", "options": ["A. What was included as the parameter to the `rcpt from:` SMTP command.", "B. What was included as the parameter to the `helo` or `ehlo` SMTP command.", "C. The domain of the user from where the email originated.", "D. A header included as part of the message that followed the `data` SMTP command.", "E. What was included as the parameter to the `mail from:` SMTP command."], "occurrences": ["2024 ST1 Q1.j", "2026 ST1 Q1.15"], "sourceLabels": ["2024 ST1", "2026 ST1"], "years": ["2024", "2026"], "papers": ["ST1"], "firstSource": "2024 ST1 Q1.j", "firstYear": "2024", "firstPaper": "ST1", "occurrenceCount": 2, "askedCurrent": true, "askedCurrentSources": ["2026 ST1"], "studyStatus": "Skip for exam review", "correctAnswer": "D", "answerSource": "memo"}, {"id": 116, "question": "After an SMTP client has sent a `data` command, it will usually send several lines of data. It signals to the server that the entire data block has been transmitted by sending the following line:", "options": ["A. `/data`", "B. `quit`", "C. `.`", "D. A blank line", "E. `fin`"], "occurrences": ["2024 ST1 Q1.k", "2025 Exam Q1.8"], "sourceLabels he NAT box. When the NAT box receives a response to such a message, it replaces the public address with the original private address, which enables the NAT box to transmit the message to the original host on the inside of the network.\n\n    Consider the following argument: Since the NAT box converts internal addresses to external addresses and vice versa, the addresses used inside the network are immaterial. Since the private addresses inside the network are never used outside the network, it does not matter whether they are public or private. An organisation can therefore choose to use public addresses inside their network, irrespective of whom they belong to - as long as the NAT box properly hides the addresses used inside the network from ever \"escaping\". Critique this argument.", "options": ["A. The argument makes perfect sense. Public addresses can be used without any further restriction inside the network.", "B. The argument does not consider the fact that public IP addresses are allocated to specific countries. This will confuse routers inside the organisation. However, if only public addresses allocated to the country where the network is located are used inside the network, using public addresses presents no problem.", "C. The fact that public addresses are associated with specific parties will cause intellectual property challenges if the solution is used. As an example, any network that uses the address 137.215.0.0/16 for its own purposes needs to obtain permission from the University of Pretoria to do so. This would even mean that it is illegal to build an isolated network where one uses the addresses that belong to someone else.", "D. Using public addresses inside the network will work fine, as long as one subnets the internal addresses exactly as they are subnetted on the public Internet.", "E. The flaw of the argument is that one would be unable to reach some addresses on the public Internet from inside the network."], "occurrences": ["2024 Exam Q1.35"], "sourceLabels": ["2024 Exam"], "years": ["2024"], "papers": ["Exam"], "firstSource": "2024 Exam Q1.35", "firstYear": "2024", "firstPaper": "Exam", "occurrenceCount": 1, "askedCurrent": false, "askedCurrentSources": [], "studyStatus": "Learn / review", "correctAnswer": "E", "answerSource": "llm"}, {"id": 164, "question": "An IPv4 multicast packet:", "options": ["A. Should be delivered to all subscribed parties.", "B. In TCP/IP has an IP address with a first byte between 224 and 239, both included.", "C. Is routed like a class C packet.", "D. More than one of the above", "E. All of the above"], "occurrences": ["2024 Exam Q1.36"], "sourceLabels": ["2024 Exam"], "years": ["2024"], "papers": ["Exam"], "firstSource": "2024 Exam Q1.36", "firstYear": "2024", "firstPaper": "Exam", "occurrenceCount": 1, "askedCurrent": false, "askedCurrentSources": [], "studyStatus": "Learn / review", "correctAnswer": "D", "answerSource": "llm"}, {"id": 165, "question": "Which ISO OSI layer is generally expected to \"throttle\" network communication on a busy network to ensure stability of the network?", "options": ["A. 6", "B. 5", "C. 4", "D. 3", "E. 2"], "occurrences": ["2024 Exam Q1.37"], "sourceLabels": ["2024 Exam"], "years": ["2024"], "papers": ["Exam"], "firstSource": "2024 Exam Q1.37", "firstYear": "2024", "firstPaper": "Exam", "occurrenceCount": 1, "askedCurrent": false, "askedCurrentSources": [], "studyStatus": "Learn / review", "correctAnswer": "D", "answerSource": "llm"}, {"id": 166, "question": "IP address 172.16.5.79 is a ... address.", "options": ["A. Class A", "B. Class B", "C. Class C", "D. Class D", "E. Class E"], "occurrences": ["2024 Exam Q1.38"], "sourceLabels": ["2024 Exam"], "years": ["2024"], "papers": ["Exam"], "firstSource": "2024 Exam Q1.38", "firstYear": "2024", "firstPaper": "Exam", "occurrenceCount": 1, "askedCurrent": false, "askedCurrentSources": [], "studyStatus": "Learn / review", "correctAnswer": "B", "answerSource": "llm"}, {"id": 167, "question": "I e AND operator. Hence `100 . 101 = 100`.\n\n    Which of the following claims is/are true?", "options": ["A. `i . m = n`", "B. `i + (-m) = b`", "C. `i + (-b) = n`", "D. More than one of the above", "E. All of the above"], "occurrences": ["2024 Exam Q1.41"], "sourceLabels": ["2024 Exam"], "years": ["2024"], "papers": ["Exam"], "firstSource": "2024 Exam Q1.41", "firstYear": "2024", "firstPaper": "Exam", "occurrenceCount": 1, "askedCurrent": false, "askedCurrentSources": [], "studyStatus": "Learn / review", "correctAnswer": "D", "answerSource": "llm"}, {"id": 170, "question": "HDLC accomplishes transparency by using:", "options": ["A. Bit stuffing", "B. Byte stuffing", "C. Known field lengths", "D. All of the above", "E. None of the above"], "occurrences": ["2024 Exam Q1.43"], "sourceLabels": ["2024 Exam"], "years": ["2024"], "papers": ["Exam"], "firstSource": "2024 Exam Q1.43", "firstYear": "2024", "firstPaper": "Exam", "occurrenceCount": 1, "askedCurrent": false, "askedCurrentSources": [], "studyStatus": "Learn / review", "correctAnswer": "A", "answerSource": "llm"}, {"id": 171, "question": "When one node polls another, it wants to know whether:", "options": ["A. The other node has something to send.", "B. The other node is communicating.", "C. It may send something to the other node.", "D. None of the above"], "occurrences": ["2024 Exam Q1.44"], "sourceLabels": ["2024 Exam"], "years": ["2024"], "papers": ["Exam"], "firstSource": "2024 Exam Q1.44", "firstYear": "2024", "firstPaper": "Exam", "occurrenceCount": 1, "askedCurrent": false, "askedCurrentSources": [], "studyStatus": "Learn / review", "correctAnswer": "A", "answerSource": "llm"}, {"id": 172, "question": "Which of the following is not a function of the data link control layer?", "options": ["A. Data delineation", "B. Error control", "C. Encoding", "D. Media access control", "E. None of the above"], "occurrences": ["2024 Exam Q1.45"], "sourceLabels": ["2024 Exam"], "years": ["2024"], "papers": ["Exam"], "first     }

    function sourceParts(source) {
      const parts = source.split(" ");
      return { year: parts[0], paper: parts[1] };
    }

    function firstSourceSort(a, b) {
      const aa = sourceParts(a.sourceLabels[0]);
      const bb = sourceParts(b.sourceLabels[0]);
      const yearCompare = Number(aa.year) - Number(bb.year);
      if (yearCompare !== 0) return yearCompare;
      const paperCompare = (paperRank[aa.paper] ?? 9) - (paperRank[bb.paper] ?? 9);
      if (paperCompare !== 0) return paperCompare;
      return a.id - b.id;
    }

    function selectedValues(container) {
      return new Set([...container.querySelectorAll("input:checked")].map(input => input.value));
    }

    function applyFilters() {
      state.search = els.search.value.trim().toLowerCase();
      state.seen = els.seen.value;
      state.sort = els.sort.value;
      state.source = els.source.value;
      state.years = selectedValues(els.yearChecks);
      state.papers = selectedValues(els.paperChecks);

      let rows = DATA.filter(row => {
        if (state.search && !textOf(row).includes(state.search)) return false;
        if (state.seen === "seen" && !row.askedCurrent) return false;
        if (state.seen === "unseen" && row.askedCurrent) return false;
        if (state.source !== "all" && !row.sourceLabels.includes(state.source)) return false;
        if (!row.years.some(year => state.years.has(year))) return false;
        if (!row.papers.some(paper => state.papers.has(paper))) return false;
        return true;
      });

      rows.sort((a, b) => {
        if (state.sort === "occurrences-desc") return b.occurrenceCount - a.occurrenceCount || firstSourceSort(a, b);
        if (state.sort === "occurrences-asc") return a.occurrenceCount - b.occurrenceCount || firstSourceSort(a, b);
        if (state.sort === "status") return Number(a.askedCurrent) - Number(b.askedCurrent) || firstSourceSort(a, b);
        if (state.sort === "question") return a.question.localeCompare(b.question) || firstSourceSort(a, b);
        if (state.sort === "id") return a.id - b.id;
        return firstSourceSort(a, b);
      });

      render(rows);
      return rows;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function render(rows) {
      const seenCount = rows.filter(row => row.askedCurrent).length;
      els.statVisible.textContent = rows.length;
      els.statSeen.textContent = DATA.filter(row => row.askedCurrent).length;
      els.resultText.textContent = `${rows.length} visible, ${seenCount} seen in 2026 tests`;
      els.sourceText.textContent = state.source === "all" ? "All sources" : state.source;

      if (!rows.length) {
        els.results.innerHTML = '<div class="empty">No MCQs match the current filters.</div>';
        return;
      }

      els.results.innerHTML = rows.map(row => {
        const statusClass = row.askedCurrent ? "seen" : "review";
        const statusText = row.askedCurrent ? `Seen: ${row.askedCurrentSources.join(", ")}` : "Learn / review";
        const correctAttr = row.correctAnswer ? ` data-correct="${escapeHtml(row.correctAnswer)}"` : "";
        const sourceAttr = row.answerSource ? ` data-source="${escapeHtml(row.answerSource)}"` : "";
        const optionItems = row.options.map(option => {
          const letter = option.split(".")[0].trim();
          return `<li><button class="option-btn" data-letter="${escapeHtml(letter)}" type="button">${escapeHtml(option)}</button></li>`;
        }).join("");
        const occurrenceText = row.occurrences.join("; ");
        const sourceText = row.sourceLabels.join(", ");
        const llmBadge = row.answerSource === 'llm' ? `<span class="badge" style="background:#fef08a;color:#c2410c">LLM Answered</span>` : "";
        
        return `
          <article class="mcq" data-id="${row.id}"${correctAttr}${sourceAttr}>
            <div class="mcq-head">
              <div class="mcq-id">#${row.id}</div>
              <p class="question">${escapeHtml(row.question)}</p>
              <div class="badges">
                ${llmBadge}
                <span class="badge ${statusClass}">${escapeHtml(statusText)}</span>
                <span class="badge">${row.occurrenceCount}x</span>
              </div>
            </div>
            <div class="mcq-body">
              <div>
                <ol class="options">${optionItems}</ol>
                <div class="quiz-footer">
                  <span class="quiz-result"></span>
                  <button class="reset-btn" type="button" style="display:none">Try again</button>
                </div>
              </div>
              <div class="detail">
                <div class="detail-block">
                  <div class="detail-title">Occurrences</div>
                  <div class="detail-text">${escapeHtml(occurrenceText)}</div>
                </div>
                <div class="detail-block">
                  <div class="detail-title">Papers</div>
                  <div class="detail-text">${escapeHtml(sourceText)}</div>
                </div>
                <div class="detail-block">
                  <div class="detail-title">First source</div>
                  <div class="detail-text">${escapeHtml(row.firstSource)}</div>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function resetFilters() {
      els.search.value = "";
      els.seen.value = "all";
      els.sort.value = "source";
      els.source.value = "all";
      [...document.querySelectorAll('.checks input')].forEach(input => input.checked = true);
      applyFilters();
    }

    async function copyVisible() {
      const rows = applyFilters();
      const text = rows.map(row => [
        `#${row.id} ${row.question}`,
        row.options.join("\n"),
        `Occurrences: ${row.occurrences.join("; ")}`,
        `Status: ${row.studyStatus}`
      ].join("\n")).join("\n\n---\n\n");

      try {
        await navigator.clipboard.writeText(text);
        els.copyVisible.textContent = "Copied";
        setTimeout(() => els.copyVisible.textContent = "Copy visible", 1000);
      } catch {
        els.copyVisible.textContent = "Copy failed";
        setTimeout(() => els.copyVisible.textContent = "Copy visible", 1400);
      }
    }

    [els.search, els.seen, els.sort, els.source].forEach(el => el.addEventListener("input", applyFilters));
    [els.yearChecks, els.paperChecks].forEach(el => el.addEventListener("change", applyFilters));
    els.reset.addEventListener("click", resetFilters);
    els.copyVisible.addEventListener("click", copyVisible);

    function handleOptionClick(btn) {
      const article = btn.closest("article.mcq");
      const correct = article.dataset.correct || null;
      const source = article.dataset.source || null;
      const chosen = btn.dataset.letter;
      const resultEl = article.querySelector(".quiz-result");
      const resetBtn = article.querySelector(".reset-btn");
      const allBtns = article.querySelectorAll(".option-btn");

      allBtns.forEach(b => b.disabled = true);
      
      const sourceLabel = source === "llm" ? " (LLM)" : "";

      if (!correct) {
        btn.style.background = "#e0e7ff";
        btn.style.borderColor = "#818cf8";
        resultEl.textContent = "Answer not in memo";
        resultEl.className = "quiz-result unknown";
      } else if (chosen === correct) {
        btn.classList.add("correct");
        resultEl.textContent = "Correct!" + sourceLabel;
        resultEl.className = "quiz-result correct";
      } else {
        btn.classList.add("incorrect");
        allBtns.forEach(b => { if (b.dataset.letter === correct) b.classList.add("correct"); });
        resultEl.textContent = `Incorrect — answer is ${correct}${sourceLabel}`;
        resultEl.className = "quiz-result incorrect";
      }

      resetBtn.style.display = "inline-block";
    }

    function handleResetClick(resetBtn) {
      const article = resetBtn.closest("article.mcq");
      const allBtns = article.querySelectorAll(".option-btn");
      const resultEl = article.querySelector(".quiz-result");

      allBtns.forEach(b => {
        b.disabled = false;
        b.classList.remove("correct", "incorrect");
        b.style.background = "";
        b.style.borderColor = "";
      });
      resultEl.textContent = "";
      resultEl.className = "quiz-result";
      resetBtn.style.display = "none";
    }

    els.results.addEventListener("click", e => {
      const btn = e.target.closest(".option-btn");
      if (btn && !btn.disabled) { handleOptionClick(btn); return; }
      const reset = e.target.closest(".reset-btn");
      if (reset) { handleResetClick(reset); }
    });

    applyFilters();
  </script>
</body>
</html>
